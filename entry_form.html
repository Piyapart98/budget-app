<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Entry — Budget Pipeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  :root {
    --bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;--border-strong:#c8c5b8;
    --text:#1a1917;--text-muted:#6b6860;--text-faint:#a8a59e;
    --green:#1a6b3c;--green-bg:#edf7f1;--green-border:#86c9a3;
    --red:#b83232;--red-bg:#fef2f2;
    --amber:#a05c00;--amber-bg:#fff8ed;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;}
  .header-title{font-size:18px;font-weight:500;}
  .header-sub{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
  .badge-manual{display:inline-block;font-size:10px;background:var(--amber-bg);color:var(--amber);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-weight:500;margin-top:4px;}
  .view{display:none;padding:16px;}
  .view.active{display:block;}
  .field-group{margin-bottom:14px;}
  .field-label{font-size:12px;color:var(--text-muted);margin-bottom:5px;display:block;font-family:var(--mono);}
  .required{color:var(--red);}
  input,select,textarea{
    width:100%;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:8px;
    font-size:14px;padding:10px 12px;font-family:var(--sans);
    outline:none;transition:border-color 0.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--border-strong);}
  select{appearance:none;-webkit-appearance:none;cursor:pointer;}
  textarea{resize:none;height:70px;font-family:var(--sans);}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .btn{width:100%;padding:13px;font-size:14px;font-family:var(--sans);font-weight:500;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;transition:background 0.15s;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--text);color:var(--surface);border-color:var(--text);}
  .btn-primary:hover{opacity:0.85;background:var(--text);}
  .btn-success{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
  .btn-success:hover{opacity:0.85;}
  .btn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;}
  .err{display:none;font-size:12px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-family:var(--mono);}
  .review-card{background:var(--bg);border-radius:10px;padding:4px 14px;margin-bottom:14px;}
  .review-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
  .review-row:last-child{border-bottom:none;}
  .review-label{font-size:12px;color:var(--text-muted);font-family:var(--mono);}
  .review-val{font-size:13px;font-weight:500;text-align:right;max-width:190px;word-break:break-word;}
  .notice{font-size:12px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border-strong);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:14px;font-family:var(--mono);line-height:1.6;}
  .done-wrap{padding:60px 20px;text-align:center;}
  .done-icon{font-size:48px;margin-bottom:14px;}
  .done-title{font-size:20px;font-weight:500;margin-bottom:8px;}
  .done-sub{font-size:12px;color:var(--text-muted);font-family:var(--mono);margin-bottom:20px;line-height:1.7;}
  .btn-sm{padding:9px 20px;font-size:13px;width:auto;display:inline-block;}
/* Settle tick — include this expense on the settlement page */
.settle-row{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 13px;
            background:var(--bg);border:1px solid var(--border);border-radius:12px;}
.settle-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex:none;}
.settle-lab{font-size:14px;color:var(--text);}
.settle-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}
.settle-row.auto{border-color:var(--green-border);background:var(--green-bg);}
.settle-row.auto .settle-sub{color:var(--green);}
/* Reimbursement picker — settle unsettled items against this income row
   (2026-07-25 spec). Collapsed by default so the form stays short. */
.reimb-wrap{margin:0 0 14px;background:var(--surface);border:1px solid var(--border);
            border-radius:12px;overflow:hidden;}
.reimb-head{display:flex;align-items:center;gap:8px;padding:12px 13px;cursor:pointer;
            user-select:none;-webkit-tap-highlight-color:transparent;}
.reimb-lab{font-size:14px;flex:1;}
.reimb-sum{font-size:12px;color:var(--text-muted);font-family:var(--mono);}
.reimb-chev{font-size:9px;color:var(--text-faint);transition:transform .15s;display:inline-block;}
.reimb-wrap.open .reimb-chev{transform:rotate(90deg);}
.reimb-body{display:none;border-top:1px solid var(--border);padding:0 13px 12px;}
.reimb-wrap.open .reimb-body{display:block;}
.reimb-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;
            border-bottom:1px solid var(--border);}
.reimb-item:last-child{border-bottom:none;}
.reimb-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);
            flex:none;margin-top:2px;}
.reimb-main{flex:1;min-width:0;}
.reimb-top{display:flex;justify-content:space-between;gap:8px;}
.reimb-desc{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reimb-amt{font-size:13px;font-weight:500;white-space:nowrap;}
.reimb-meta{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
.reimb-share{display:flex;align-items:center;gap:6px;margin-top:8px;}
.reimb-share input{width:84px;padding:6px 8px;font-size:13px;font-family:var(--mono);}
.reimb-share span{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.reimb-foot{font-size:12px;font-family:var(--mono);color:var(--text-muted);
            padding-top:10px;border-top:1px solid var(--border);}
.reimb-diff{color:var(--amber);background:var(--amber-bg);border-radius:6px;
            padding:6px 8px;margin-top:6px;}
.reimb-empty{font-size:12px;color:var(--text-faint);font-family:var(--mono);padding:12px 0;}
</style>
<!-- card-split v1 (2026-06-14) -->
</head>
<body>
<header>
  <a href="./" style="display:inline-block;font-size:11px;color:var(--text-muted);text-decoration:none;font-family:var(--mono);padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);margin-bottom:8px;">← Home</a>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <div class="header-title">New entry</div>
      <div class="header-sub">pipeline v4 · entry_form.html</div>
    </div>
    <span class="badge-manual">manual</span>
  </div>
</header>

<div id="form-view" class="view active">
  <div class="field-group">
    <label class="field-label" for="f-date">Date <span class="required">*</span></label>
    <input type="date" id="f-date">
  </div>
  <div class="field-group">
    <label class="field-label" for="f-desc">Description <span class="required">*</span></label>
    <input type="text" id="f-desc" placeholder="What was this for?">
  </div>
  <div class="grid2">
    <div class="field-group">
      <label class="field-label" for="f-amount">Amount (THB) <span class="required">*</span></label>
      <input type="number" id="f-amount" placeholder="0" min="0" step="1">
    </div>
    <div class="field-group">
      <label class="field-label" for="f-note">Note</label>
      <input type="text" id="f-note" placeholder="optional">
    </div>
  </div>
  <div class="field-group">
    <label class="field-label" for="f-card">Card</label>
    <select id="f-card"><option value="">None</option></select>
  </div>
  <div class="field-group">
    <label class="field-label" for="f-cat">Category</label>
    <select id="f-cat">
      <option value="">— leave blank —</option>
      <optgroup label="Spending">
        <option>Food</option><option>Drinks and Snacks</option><option>Transport</option>
        <option>Health / Necessaries</option><option>Shopping</option><option>Groceries</option>
        <option>Utilities and Subs</option><option>Sports</option>
        <option>Social Expenses / Donation</option><option>With Roong</option>
        <option>To Mom</option><option>Other spending</option>
      </optgroup>
      <optgroup label="Income">
        <option>Salary</option><option>Bonus</option><option>Reimbursement</option>
        <option>Payback from someone</option><option>Interest payment</option>
        <option>Other income</option>
      </optgroup>
      <optgroup label="Saving">
        <option>Provident Fund</option><option>Mutual Fund</option>
        <option>Coop Account</option><option>Saving for EOY Tax Deduction</option>
        <option>Other saving</option>
      </optgroup>
    </select>
  </div>
  <label class="settle-row" id="settle-wrap">
    <input type="checkbox" id="f-settle">
    <span><span class="settle-lab">Include in settlement</span>
      <div class="settle-sub" id="settle-sub">will appear on the settlement page</div></span>
  </label>
  <div class="reimb-wrap" id="reimb-wrap" style="display:none;">
    <div class="reimb-head" id="reimb-head">
      <span class="reimb-lab">Reimburses</span>
      <span class="reimb-sum" id="reimb-sum">none selected</span>
      <span class="reimb-chev">▶</span>
    </div>
    <div class="reimb-body" id="reimb-body"></div>
  </div>
  <div class="err" id="form-err"></div>
  <button class="btn btn-primary" onclick="goReview()">Review entry →</button>
</div>

<div id="review-view" class="view">
  <div class="review-card">
    <div class="review-row"><span class="review-label">Date</span><span class="review-val" id="r-date">—</span></div>
    <div class="review-row"><span class="review-label">Description</span><span class="review-val" id="r-desc">—</span></div>
    <div class="review-row"><span class="review-label">Amount</span><span class="review-val" id="r-amount">—</span></div>
    <div class="review-row"><span class="review-label">Category</span><span class="review-val" id="r-cat">—</span></div>
    <div class="review-row"><span class="review-label">Card</span><span class="review-val" id="r-card">—</span></div>
    <div class="review-row"><span class="review-label">Note</span><span class="review-val" id="r-note">—</span></div>
    <div class="review-row"><span class="review-label">Settle</span><span class="review-val" id="r-settle">—</span></div>
    <div class="review-row" id="r-reimb-row" style="display:none;"><span class="review-label">Reimburses</span><span class="review-val" id="r-reimb">—</span></div>
    <div class="review-row"><span class="review-label">Source</span><span class="review-val" style="color:var(--amber);">manual</span></div>
  </div>
  <div class="notice">No slip attached. Row will be marked <strong>source: manual</strong> in database.csv.</div>
  <div class="err" id="review-err"></div>
  <div class="btn-grid">
    <button class="btn" id="btn-back" onclick="goBack()">← Edit</button>
    <button class="btn btn-success" id="btn-commit" onclick="doCommit()">✓ Commit</button>
  </div>
</div>

<div id="done-view" class="view">
  <div class="done-wrap">
    <div class="done-icon">✓</div>
    <div class="done-title">Row committed</div>
    <div class="done-sub" id="done-summary">—</div>
    <button class="btn btn-primary btn-sm" onclick="doReset()">+ Add another</button>
  </div>
</div>

<script src="data-source.js"></script>
<script>
function v(id){return document.getElementById(id).value.trim();}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Populate the Card <select> from the editable card list (DataSource.loadCards
// → /api/cards local, cards.json on GitHub). "None" default + an "Add card…"
// item that captures name + last-4 so the new card auto-detects on future slips.
let cardOptions=[];
async function loadCardSelect(){
  try{ cardOptions=(await DataSource.loadCards())||[]; }catch(_){ cardOptions=[]; }
  const sel=document.getElementById('f-card');
  const cur=sel.value;
  sel.innerHTML='<option value="">None</option>'+
    cardOptions.map(c=>`<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('')+
    '<option value="__add__">➕ Add card…</option>';
  sel.value=cur||'';
}
loadCardSelect();
document.getElementById('f-card').addEventListener('change',async function(e){
  const sel=e.target;
  if(sel.value!=='__add__') return;
  const name=window.prompt('New card name (e.g. Krungthai Travel):');
  if(!name||!name.trim()){sel.value='';return;}
  const last4=window.prompt('Card last-4 digits (for auto-detect):');
  if(!last4||!/^\d{4}$/.test(last4.trim())){alert('Last-4 must be exactly 4 digits.');sel.value='';return;}
  // Optional: payment due day (1-28) → drives the homepage "Cards due" countdown.
  let dueDay=window.prompt('Payment due day of month, 1-28 (optional — leave blank to skip):');
  dueDay=dueDay==null?'':dueDay.trim();
  if(dueDay!==''){
    const d=Number(dueDay);
    if(!(Number.isInteger(d)&&d>=1&&d<=28)){alert('Due day must be a whole number 1-28.');sel.value='';return;}
    dueDay=d;
  }
  try{
    cardOptions=await DataSource.saveCard(last4.trim(),name.trim(),dueDay===''?null:dueDay);
    await loadCardSelect();
    sel.value=name.trim();
  }catch(err){alert('Add card failed: '+(err&&err.message?err.message:err));sel.value='';}
});
// Settle tick: auto-follows the With Roong category; a manual toggle wins until
// the category changes again.
const ROONG_CAT='With Roong';
let settleTouched=false;
function refreshSettleRow(auto){
  const wrap=document.getElementById('settle-wrap');
  const sub=document.getElementById('settle-sub');
  wrap.classList.toggle('auto',!!auto);
  sub.textContent=auto?'auto-ticked — category is “With Roong”'
                      :'will appear on the settlement page';
}
document.getElementById('f-cat').addEventListener('change',function(){
  const isRoong=v('f-cat')===ROONG_CAT;
  document.getElementById('f-settle').checked=isRoong;
  settleTouched=false;
  refreshSettleRow(isRoong);
  refreshReimbVisibility();
});

// --- Reimbursement / payback picker (2026-07-25 spec; payback 2026-07-31) ----
// A Reimbursement or "Payback from someone" row can settle unsettled expenses
// the moment it is created. The picks ride with the row in doCommit() so the
// settlement is written as soon as the RefID is assigned — see
// run_pipeline.create_reimbursement_settlement.
const SETTLE_CATS={
  'Reimbursement':        {label:'Reimburses', verb:'reimburse', noun:'reimbursement'},
  'Payback from someone': {label:'Pays back',  verb:'pay back',  noun:'payback'},
};
function settleCat(){return SETTLE_CATS[v('f-cat')]||null;}
let reimbPool=null;     // null = not loaded yet; [] = loaded and empty
let reimbPicks={};      // RefID -> share in baht
let reimbLoading=false;

function reimbFmt(n){
  const x=parseFloat(n)||0;
  return '฿'+(x===Math.round(x)?Math.round(x).toLocaleString():x.toFixed(2));
}
function reimbEsc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function reimbTotal(){
  return Object.keys(reimbPicks)
    .reduce((t,k)=>t+(parseFloat(reimbPicks[k])||0),0);
}
function reimbDate(iso){
  try{return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
  catch(e){return iso||'';}
}
// Categories that are inflows. Read straight off the Category select so this
// can never drift from the list the user actually picks from.
function inflowCats(){
  const skip={};
  document.querySelectorAll('#f-cat optgroup').forEach(g=>{
    if(g.label==='Income'||g.label==='Saving')
      g.querySelectorAll('option').forEach(o=>{skip[o.textContent.trim()]=true;});
  });
  return skip;
}

function refreshReimbVisibility(){
  const cat=settleCat();
  document.getElementById('reimb-wrap').style.display=cat?'':'none';
  if(!cat){reimbPicks={};renderReimb();return;}
  // Both settling categories share one picker; only the wording differs.
  document.querySelector('#reimb-wrap .reimb-lab').textContent=cat.label;
  const rl=document.querySelector('#r-reimb-row .review-label');
  if(rl)rl.textContent=cat.label;
  reimbEnsurePool();
  renderReimb();
}

async function reimbEnsurePool(){
  if(reimbPool!==null||reimbLoading)return;
  reimbLoading=true;
  renderReimb();
  try{
    const pool=await DataSource.loadRoongUnsettled();
    // An income/saving row can carry Settle=True today, which would put an
    // inflow in the pool as if it were an expense. Keep those out of here.
    const skip=inflowCats();
    reimbPool=pool.filter(r=>!skip[String(r.Category||'').trim()]);
  }catch(e){reimbPool=[];}
  reimbLoading=false;
  renderReimb();
}

function renderReimb(){
  const sum=document.getElementById('reimb-sum');
  const body=document.getElementById('reimb-body');
  const n=Object.keys(reimbPicks).length;
  sum.textContent=n?n+' · '+reimbFmt(reimbTotal()):'none selected';
  const row=document.getElementById('r-reimb-row');
  if(row){
    row.style.display=n?'':'none';
    document.getElementById('r-reimb').textContent=
      n+' item'+(n===1?'':'s')+' · '+reimbFmt(reimbTotal());
  }
  if(reimbPool===null){
    body.innerHTML='<div class="reimb-empty">'+
      (reimbLoading?'Loading unsettled items…':'')+'</div>';
    return;
  }
  if(!reimbPool.length){
    body.innerHTML='<div class="reimb-empty">Nothing unsettled to '+
      ((settleCat()||{}).verb||'settle')+'.</div>';
    return;
  }
  let html='';
  reimbPool.forEach((r,i)=>{
    const ref=String(r.RefID||'');
    const picked=Object.prototype.hasOwnProperty.call(reimbPicks,ref);
    const amt=parseFloat(r.Amount)||0;
    const share=picked?(parseFloat(reimbPicks[ref])||0):amt;
    const pct=amt>0?Math.round(share/amt*100):0;
    html+='<div class="reimb-item">'+
      '<input type="checkbox" data-ref="'+reimbEsc(ref)+'"'+(picked?' checked':'')+'>'+
      '<div class="reimb-main">'+
        '<div class="reimb-top"><span class="reimb-desc">'+reimbEsc(r.Description||'')+
          '</span><span class="reimb-amt">'+reimbFmt(amt)+'</span></div>'+
        '<div class="reimb-meta">'+reimbDate(r.Date)+' · '+
          reimbEsc(r.Category||'')+' · '+reimbEsc(ref)+'</div>'+
        (picked?'<div class="reimb-share">'+
          '<input type="number" min="0" max="100" step="1" value="'+pct+
            '" data-ref="'+reimbEsc(ref)+'" data-kind="pct">'+
          '<span>% =</span>'+
          '<input type="number" min="0" step="0.5" value="'+share.toFixed(2)+
            '" data-ref="'+reimbEsc(ref)+'" data-kind="baht">'+
        '</div>':'')+
      '</div></div>';
  });
  html+='<div class="reimb-foot" id="reimb-foot"></div>';
  body.innerHTML=html;
  wireReimb();
  refreshReimbFoot();
}

function refreshReimbFoot(){
  const foot=document.getElementById('reimb-foot');
  if(!foot)return;
  const n=Object.keys(reimbPicks).length, total=reimbTotal();
  const amount=parseFloat(v('f-amount'))||0;
  let html=n+' selected · '+reimbFmt(total);
  const diff=total-amount;
  if(n&&amount>0&&Math.abs(diff)>=0.005){
    html+='<div class="reimb-diff">'+reimbFmt(Math.abs(diff))+' '+
      (diff<0?'less':'more')+' than the '+((settleCat()||{}).noun||'income row')+
      ' — amounts stay as entered</div>';
  }
  foot.innerHTML=html;
  document.getElementById('reimb-sum').textContent=
    n?n+' · '+reimbFmt(total):'none selected';
}

function wireReimb(){
  document.querySelectorAll('#reimb-body input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',function(){
      const ref=cb.dataset.ref;
      if(cb.checked){
        const row=reimbPool.find(r=>String(r.RefID||'')===ref);
        reimbPicks[ref]=parseFloat(row&&row.Amount)||0;   // default: the whole thing
      }else{
        delete reimbPicks[ref];
      }
      renderReimb();
    });
  });
  // Share edits update in place — re-rendering here would drop focus mid-typing.
  document.querySelectorAll('#reimb-body input[data-kind]').forEach(inp=>{
    inp.addEventListener('input',function(){
      const ref=inp.dataset.ref;
      const row=reimbPool.find(r=>String(r.RefID||'')===ref);
      const amt=parseFloat(row&&row.Amount)||0;
      let share;
      if(inp.dataset.kind==='pct'){
        const pct=Math.max(0,Math.min(100,parseFloat(inp.value)||0));
        share=amt*pct/100;
        const other=document.querySelector('#reimb-body input[data-kind=baht][data-ref="'+ref+'"]');
        if(other)other.value=share.toFixed(2);
      }else{
        share=Math.max(0,Math.min(amt,parseFloat(inp.value)||0));
        const other=document.querySelector('#reimb-body input[data-kind=pct][data-ref="'+ref+'"]');
        if(other)other.value=amt>0?Math.round(share/amt*100):0;
      }
      reimbPicks[ref]=share;
      refreshReimbFoot();
    });
  });
}

function reimbPayload(){
  return Object.keys(reimbPicks)
    .map(ref=>({RefID:ref,roong_share:parseFloat(reimbPicks[ref])||0}));
}

document.getElementById('reimb-head').addEventListener('click',function(){
  document.getElementById('reimb-wrap').classList.toggle('open');
});
document.getElementById('f-amount').addEventListener('input',refreshReimbFoot);
document.getElementById('f-settle').addEventListener('change',function(){
  settleTouched=true;
  refreshSettleRow(false);
});
function show(id){['form-view','review-view','done-view'].forEach(x=>document.getElementById(x).className='view');document.getElementById(id).className='view active';}
function showErr(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block';}
function hideErr(id){document.getElementById(id).style.display='none';}

// Set today's date as default
(function(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('f-date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
})();

function goReview(){
  const date=v('f-date'),desc=v('f-desc'),amount=v('f-amount');
  if(!date||!desc||!amount){showErr('form-err','Date, description, and amount are required.');return;}
  if(isNaN(parseInt(amount))||parseInt(amount)<0){showErr('form-err','Amount must be a non-negative number.');return;}
  hideErr('form-err');
  hideErr('review-err');
  document.getElementById('r-date').textContent=date;
  document.getElementById('r-desc').textContent=desc;
  document.getElementById('r-amount').textContent='฿'+parseInt(amount).toLocaleString();
  document.getElementById('r-cat').textContent=v('f-cat')||'blank';
  document.getElementById('r-card').textContent=v('f-card')||'None';
  document.getElementById('r-note').textContent=v('f-note')||'blank';
  document.getElementById('r-settle').textContent=
    document.getElementById('f-settle').checked?'Yes':'No';
  renderReimb();
  show('review-view');
}

function goBack(){hideErr('review-err');show('form-view');}

async function doCommit(){
  const btn=document.getElementById('btn-commit');
  const back=document.getElementById('btn-back');
  hideErr('review-err');
  btn.disabled=true;back.disabled=true;
  const origText=btn.textContent;
  btn.textContent='Committing…';

  const cat=settleCat();
  const picks=cat?reimbPayload():[];
  // Warn, don't block, when the picks don't add up to the reimbursement/payback.
  if(picks.length){
    const total=picks.reduce((t,p)=>t+p.roong_share,0);
    const amt=parseFloat(v('f-amount'))||0;
    const diff=total-amt;
    if(Math.abs(diff)>=0.005&&!confirm(
        'The '+picks.length+' selected item'+(picks.length===1?'':'s')+
        ' total '+reimbFmt(total)+', which is '+reimbFmt(Math.abs(diff))+' '+
        (diff<0?'less':'more')+' than this '+(cat.noun||'reimbursement')+' of '+reimbFmt(amt)+
        '.\n\nCommit anyway?')){
      btn.disabled=false;back.disabled=false;btn.textContent=origText;
      return;
    }
  }

  const payload={
    Date:        v('f-date'),
    Description: v('f-desc'),
    Amount:      v('f-amount'),
    Category:    v('f-cat'),
    Card:        v('f-card')==='__add__'?'':v('f-card'),
    Note:        v('f-note'),
    Settle:      document.getElementById('f-settle').checked?'True':'',
  };
  if(picks.length)payload.Reimburses=picks;

  try{
    const data=await DataSource.submitEntry(payload);
    const row=data.row||{};
    const desc=row.Description||payload.Description;
    const amount='฿'+parseInt(row.Amount||payload.Amount).toLocaleString();
    const date=row.Date||payload.Date;
    const ref=row.RefID||'manual';
    // The row is saved either way. If its settlement leg failed, say so plainly
    // rather than implying the items were settled — nothing is half-stamped,
    // and the picks can be redone from the settlement page.
    let extra='';
    if(data.reimburse_error){
      extra='<br><span style="color:var(--red)">Row saved, but the items were '+
            'not settled: '+reimbEsc(data.reimburse_error)+'</span>';
    }else if(data.reimbursement&&data.reimbursement.settlement_id){
      extra='<br>settled '+data.reimbursement.rows+' item'+
            (data.reimbursement.rows===1?'':'s')+' · '+
            reimbEsc(data.reimbursement.settlement_id);
    }
    document.getElementById('done-summary').innerHTML=
      `${desc} · ${amount}<br>${date} · source: ${ref}${extra}`;
    show('done-view');
  }catch(e){
    showErr('review-err','Commit failed: '+e.message);
    btn.disabled=false;back.disabled=false;
    btn.textContent=origText;
  }
}

function doReset(){
  ['f-desc','f-amount'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-cat').value='';
  document.getElementById('f-note').value='';
  document.getElementById('f-settle').checked=false;
  settleTouched=false;
  refreshSettleRow(false);
  // A committed match consumed rows from the pool — force a re-read next time.
  reimbPicks={};
  reimbPool=null;
  document.getElementById('reimb-wrap').classList.remove('open');
  refreshReimbVisibility();
  hideErr('form-err');
  hideErr('review-err');
  const btn=document.getElementById('btn-commit');
  if(btn){btn.disabled=false;btn.textContent='✓ Commit';}
  const back=document.getElementById('btn-back');
  if(back){back.disabled=false;}
  show('form-view');
}
</script>
</body>
</html>
