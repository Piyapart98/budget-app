<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Review</title>
<!-- warm-journal review v1.4 — default Other (2026-06-13) -->
<link rel="stylesheet" href="warm.css">
<style>
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .progress{font-size:12px;color:var(--text-faint);}
  .readslip-btn{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--text-soft);
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:5px 11px;cursor:pointer;white-space:nowrap;}
  .readslip-btn:active{opacity:.6;}
  .readslip-btn:disabled{opacity:.5;cursor:default;}

  /* ---- Swipe deck ---- */
  .stage{position:relative;min-height:50vh;margin-top:12px;}
  .slip-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.07);touch-action:pan-y;position:relative;
    will-change:transform;}
  .slip-card.flyout{transition:transform .32s ease-out,opacity .32s ease-out;}
  .slip-card.springback{transition:transform .25s cubic-bezier(.2,.8,.3,1);}

  .slip-img{width:100%;height:34vh;max-height:280px;object-fit:contain;background:#f4f1ea;
    border-radius:12px;display:block;cursor:zoom-in;}
  .slip-img.empty{display:flex;align-items:center;justify-content:center;color:var(--text-faint);
    font-size:12px;text-align:center;padding:18px;}

  .amount{font-family:var(--serif);font-size:30px;font-weight:400;margin:12px 0 2px;}

  /* editable field pills (#2) */
  .fields{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 2px;}
  .fpill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);
    border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-size:13px;cursor:text;}
  .fpill .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);}
  .fpill .v{font-weight:500;}
  .fpill.empty .v{color:var(--amber-text);}
  .fpill.editing{background:var(--surface);border-color:#c8c0ae;}
  .fpill input{font-size:13px;font-family:var(--sans);border:none;outline:none;background:transparent;
    color:var(--text);min-width:70px;max-width:180px;}
  .edit-hint{font-size:11px;color:var(--text-faint);margin:3px 2px 0;}

  /* category (#1) — Option A bottom sheet */
  .cat-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0;}
  .cat-head .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);}
  .cat-now{display:inline-flex;align-items:center;gap:7px;background:var(--green);color:#fff;
    border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;margin-top:7px;}
  .cat-change{background:none;border:none;color:var(--green);font-size:13px;font-weight:600;
    cursor:pointer;font-family:var(--sans);padding:4px;}

  /* tap buttons */
  .actions{display:flex;gap:10px;margin-top:16px;}
  .actions .btn{flex:1;}
  .actions .btn-ok{flex:2;}

  /* Tinder stamps */
  .stamp{position:absolute;top:24px;font-size:24px;font-weight:800;letter-spacing:1px;
    padding:5px 14px;border:4px solid;border-radius:12px;opacity:0;pointer-events:none;
    text-transform:uppercase;z-index:5;}
  .stamp.ok{left:18px;color:var(--green);border-color:var(--green);transform:rotate(-13deg);}
  .stamp.no{right:18px;color:var(--red);border-color:var(--red);transform:rotate(13deg);}

  /* bottom sheet */
  .sheet-bd{position:fixed;inset:0;background:rgba(20,18,14,.4);z-index:50;display:none;}
  .sheet-bd.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);
    border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s ease;max-width:480px;margin:0 auto;
    max-height:72vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .sheet h3{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:12px;}
  .cat-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--text-faint);margin:14px 2px 8px;}
  .cat-group-label:first-child{margin-top:0;}
  .cat-grid{display:flex;flex-wrap:wrap;gap:7px;}
  .cchip{display:inline-flex;align-items:center;gap:6px;background:#f1efe8;color:var(--text-soft);
    border:1px solid transparent;border-radius:999px;font-size:13px;padding:8px 13px;cursor:pointer;}
  .cchip.on{background:var(--green);color:#fff;}

  /* submit gate + done */
  .submit-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:none;max-width:480px;margin:0 auto;}
  .submit-bar.show{display:block;}
  .submit-btn{width:100%;padding:14px;background:var(--text);color:var(--surface);border:none;
    border-radius:14px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer;}
  .submit-note{font-size:11px;color:var(--text-faint);text-align:center;margin-top:6px;}

  .done-box{text-align:center;padding:38px 12px;}
  .done-box h2{font-family:var(--serif);font-weight:400;font-size:23px;margin-bottom:8px;}
  .done-box .sub{font-size:13px;color:var(--text-soft);line-height:1.5;}
  .done-list{text-align:left;margin-top:18px;}
  .replay{margin-top:18px;background:none;border:1px solid var(--border);border-radius:10px;
    padding:9px 16px;font-size:13px;color:var(--text-soft);cursor:pointer;font-family:var(--sans);}

  /* lightbox — tap the slip image to expand (same as the live page) */
  .lightbox{position:fixed;inset:0;background:rgba(20,18,14,.92);z-index:60;display:none;
    align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}

  /* possible-duplicate heads-up (is_duplicate from loadDrafts) */
  .dup-badge{display:inline-flex;align-items:center;gap:4px;margin:0 0 8px;
    padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;
    color:var(--red);background:rgba(193,74,60,.10);border:1px solid var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Review</h1>
    <div class="topbar-right">
      <span class="progress" id="progress"></span>
      <button class="readslip-btn" id="read-slip" title="Force an OCR run now">↻ Read slip</button>
    </div>
  </div>
  <a class="back-link" href="index.html">‹ Home</a>
  <div class="stage" id="stage"><div class="soft-note">Loading slips…</div></div>
</div>

<!-- category bottom sheet (Option A) -->
<div class="sheet-bd" id="sheet-bd"></div>
<div class="sheet" id="sheet">
  <h3>Choose a category</h3>
  <div id="sheet-grid"></div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<div class="submit-bar" id="submit-bar">
  <button class="submit-btn" id="submit-btn">Submit</button>
  <div class="submit-note" id="submit-note"></div>
</div>

<script src="data-source.js"></script>
<script src="warm-shared.js"></script>
<script>
// Warm Journal review (graduated from the mockup). Reads via DataSource.loadDrafts/
// loadSlipImage; Submit is the real batch gate (DataSource.submitReview) — nothing
// writes until Submit. local → POST /api/review/submit; github → database.csv repo writes.
(function () {
  'use strict';
  // Must match review.html CAT_GROUPS (both Spending and Income/Savings shown).
  var CAT_GROUPS = [
    { group: 'Spending', items: ['Food','Drinks and Snacks','Transport','Health / Necessaries',
        'Shopping','Groceries','Utilities and Subs','Sports','Social Expenses / Donation',
        'With Roong','To Mom','Other'] },
    { group: 'Income / Savings', items: ['Salary','Bonus','Reimbursement','Payback from someone',
        'Provident Fund','Mutual Fund','Coop Account','Saving for EOY Tax Deduction',
        'Interest payment'] },
  ];
  // Income/Savings categories are inflows → "+" in the submit feed; spending → "−".
  var INCOME_CATS = {};
  CAT_GROUPS[1].items.forEach(function (c) { INCOME_CATS[c] = true; });
  function isIncomeCat(c) { return !!INCOME_CATS[(c || '').trim()]; }

  var slips = [], cursor = 0, decisions = [], curSrc = null;
  var stage = document.getElementById('stage');
  var sheetBd = document.getElementById('sheet-bd'), sheet = document.getElementById('sheet');
  var lightbox = document.getElementById('lightbox');

  function openLightbox() {
    if (!curSrc) return;
    document.getElementById('lightbox-img').src = curSrc;
    lightbox.classList.add('open');
  }
  lightbox.addEventListener('click', function () { lightbox.classList.remove('open'); });

  function fieldVal(slip, key) {
    var f = (slip.fields || {})[key];
    return (f && f.value != null) ? String(f.value) : '';
  }
  function setProgress() {
    document.getElementById('progress').textContent =
      (slips.length && cursor < slips.length) ? (cursor + 1) + ' of ' + slips.length : '';
  }

  function render() {
    setProgress();
    if (cursor >= slips.length) return renderDone();
    var s = slips[cursor];

    stage.innerHTML =
      '<div class="slip-card" id="card">' +
        '<div class="stamp ok">Looks right</div>' +
        '<div class="stamp no">Reject</div>' +
        '<img class="slip-img" id="slip-img" alt="slip">' +
        (s.is_duplicate ? '<div class="dup-badge">⚠ possible duplicate</div>' : '') +
        '<div class="amount" id="amount">' + Mock.fmtBaht(s.edit.Amount) + '</div>' +
        fieldsHtml(s) +
        '<div class="edit-hint">Tap a field above to fix it.</div>' +
        catHtml(s) +
        '<div class="actions">' +
          '<button class="btn btn-ghost" id="skip">Skip</button>' +
          '<button class="btn btn-green btn-ok" id="ok">Looks right ✓</button>' +
        '</div>' +
      '</div>';

    curSrc = null;
    DataSource.loadSlipImage(s).then(function (src) {
      var img = document.getElementById('slip-img');
      if (img && src) {
        img.src = src; curSrc = src;
        img.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(); });
      } else if (img) { img.classList.add('empty'); img.outerHTML =
        '<div class="slip-img empty" id="slip-img">' + Mock.escapeHtml(s.filename || 'no image') + '</div>'; }
    }).catch(function () {});

    wireFields(s);
    wireCat(s);
    wireDecide(s);
    wireSwipe();
  }

  // ---- editable fields (#2) ----
  function fieldsHtml(s) {
    var defs = [['Date', s.edit.Date || ''], ['Description', s.edit.Description || ''],
                ['Note', s.edit.Note || '']];
    return '<div class="fields">' +
      // Amount is shown big above; offer an Amount pill too for quick edit.
      '<span class="fpill" data-f="Amount"><span class="k">Amount</span>' +
        '<span class="v">' + Mock.escapeHtml(s.edit.Amount || '0') + '</span></span>' +
      defs.map(function (d) {
        var empty = !d[1];
        return '<span class="fpill' + (empty ? ' empty' : '') + '" data-f="' + d[0] + '">' +
          '<span class="k">' + d[0] + '</span><span class="v">' +
          Mock.escapeHtml(empty ? '+ add ' + d[0].toLowerCase() : d[1]) + '</span></span>';
      }).join('') + '</div>';
  }
  function wireFields(s) {
    Array.prototype.forEach.call(stage.querySelectorAll('.fpill'), function (p) {
      p.addEventListener('click', function (e) {
        e.stopPropagation();
        if (p.classList.contains('editing')) return;
        var key = p.getAttribute('data-f');
        var cur = s.edit[key] || '';
        var type = key === 'Amount' ? 'number' : key === 'Date' ? 'date' : 'text';
        p.classList.remove('empty');
        p.classList.add('editing');
        p.innerHTML = '<span class="k">' + key + '</span>' +
          '<input type="' + type + '" value="' + Mock.escapeHtml(cur) + '">';
        var inp = p.querySelector('input'); inp.focus();
        try { inp.select && inp.select(); } catch (_) {}
        function done() { s.edit[key] = inp.value; render(); }
        inp.addEventListener('blur', done);
        inp.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
        });
      });
    });
  }

  // ---- category (#1) — Option A bottom sheet ----
  function catHtml(s) {
    return '<div class="cat-head"><span class="lbl">Category</span>' +
      '<button class="cat-change" id="cat-change">Change ▾</button></div>' +
      '<div><span class="cat-now">' + Mock.catEmoji(s.chosen) + ' ' +
      Mock.escapeHtml(s.chosen) + '</span></div>';
  }
  function gridChips(s) {
    return CAT_GROUPS.map(function (g) {
      var chips = g.items.map(function (c) {
        return '<span class="cchip' + (c === s.chosen ? ' on' : '') + '" data-c="' +
          Mock.escapeHtml(c) + '">' + Mock.catEmoji(c) + ' ' + Mock.escapeHtml(c) + '</span>';
      }).join('');
      return '<div class="cat-group-label">' + Mock.escapeHtml(g.group) + '</div>' +
        '<div class="cat-grid">' + chips + '</div>';
    }).join('');
  }
  function wireCat(s) {
    var btn = document.getElementById('cat-change');
    if (btn) btn.addEventListener('click', function (e) { e.stopPropagation(); openSheet(s); });
  }
  function openSheet(s) {
    var grid = document.getElementById('sheet-grid');
    grid.innerHTML = gridChips(s);
    grid.onclick = function (e) {
      var ch = e.target.closest('.cchip'); if (!ch) return;
      s.chosen = ch.getAttribute('data-c'); closeSheet(); render();
    };
    sheetBd.classList.add('open'); sheet.classList.add('open');
  }
  function closeSheet() { sheetBd.classList.remove('open'); sheet.classList.remove('open'); }
  sheetBd.addEventListener('click', closeSheet);

  // ---- decisions: swipe + buttons + stamps (#1) ----
  function wireDecide(s) {
    var decided = false;
    function go(kind) {
      if (decided) return; decided = true;
      decisions.push({ slip: s, kind: kind });
      var card = document.getElementById('card');
      card.classList.add('flyout');
      if (kind === 'skip') {
        // Set aside — slide the card down. Skip is "pending": the slip stays in
        // the queue (never submitted), to revisit after the batch.
        card.style.transform = 'translateY(' + (window.innerHeight * 0.6 + 140) + 'px)';
      } else {
        var w = window.innerWidth, dir = kind === 'ok' ? 1 : -1;
        card.style.transform = 'translateX(' + (dir * (w + 140)) + 'px) rotate(' + (dir * 16) + 'deg)';
      }
      card.style.opacity = '0';
      setTimeout(function () { cursor++; render(); }, 300);
    }
    document.getElementById('ok').addEventListener('click', function () { go('ok'); });
    document.getElementById('skip').addEventListener('click', function () { go('skip'); });
    // Swipe left still = reject (REJECTED_ prefix); the Skip button is separate.
    stage._go = go;
  }

  var drag = null;
  function wireSwipe() {
    var card = document.getElementById('card'); if (!card) return;
    card.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.fpill, .btn, .cat-change')) return;
      drag = { card: card, x0: e.clientX, y0: e.clientY, lock: null };
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (drag.lock === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        drag.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if (drag.lock !== 'x') return;
      e.preventDefault();
      drag.card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 20) + 'deg)';
      var frac = Math.min(Math.abs(dx) / (drag.card.offsetWidth * 0.4), 1);
      var ok = drag.card.querySelector('.stamp.ok'), no = drag.card.querySelector('.stamp.no');
      if (dx > 0) { ok.style.opacity = frac; no.style.opacity = 0; }
      else { no.style.opacity = frac; ok.style.opacity = 0; }
    });
    function up(e) {
      if (!drag) return;
      var card = drag.card, dx = e.clientX - drag.x0, lock = drag.lock; drag = null;
      var thresh = card.offsetWidth * 0.35;
      if (lock === 'x' && Math.abs(dx) > thresh) { stage._go(dx > 0 ? 'ok' : 'reject'); }
      else {
        card.classList.add('springback'); card.style.transform = '';
        var ok = card.querySelector('.stamp.ok'), no = card.querySelector('.stamp.no');
        if (ok) ok.style.opacity = 0; if (no) no.style.opacity = 0;
        card.addEventListener('transitionend', function () { card.classList.remove('springback'); }, { once: true });
      }
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', up);
  }

  // ---- submit gate + status (#3) ----
  function renderDone() {
    var bar = document.getElementById('submit-bar');
    var ok = decisions.filter(function (d) { return d.kind === 'ok'; });
    var rejected = decisions.filter(function (d) { return d.kind === 'reject'; });
    var skipped = decisions.filter(function (d) { return d.kind === 'skip'; });

    if (!decisions.length) {
      stage.innerHTML = '<div class="slip-card done-box"><h2>Inbox zero ✨</h2>' +
        '<div class="sub">No slips waiting for review.</div></div>';
      bar.classList.remove('show');
      return;
    }

    // Skipped slips are never submitted — they stay in the queue. Only confirmed
    // + rejected are actionable, so the Submit bar shows only when there's one.
    var actionable = ok.length + rejected.length;
    var skipNote = skipped.length ? ' · ' + skipped.length + ' skipped (stays in queue)' : '';

    if (actionable) {
      bar.classList.add('show');
      document.getElementById('submit-note').textContent =
        ok.length + ' to submit · ' + rejected.length + ' rejected' + skipNote;
      document.getElementById('submit-btn').textContent =
        'Submit ' + ok.length + ' slip' + (ok.length === 1 ? '' : 's');
      document.getElementById('submit-btn').onclick = function () { submit(ok.length, rejected.length); };
    } else {
      bar.classList.remove('show');
    }

    var sub = actionable
      ? ('You confirmed <b>' + ok.length + '</b>, rejected <b>' + rejected.length + '</b>' +
         (skipped.length ? ', skipped <b>' + skipped.length + '</b>' : '') + '. ' +
         'Nothing is saved yet — review below, then tap <b>Submit</b>. ' +
         'It writes only on Submit — never auto-pushes.' +
         (skipped.length ? ' Skipped slips stay in your queue to revisit.' : ''))
      : ('You skipped <b>' + skipped.length + '</b> slip' + (skipped.length === 1 ? '' : 's') +
         ' — they stay in your queue. Nothing to submit; reload to revisit them.');

    stage.innerHTML =
      '<div class="slip-card done-box"><h2>' + (actionable ? 'Ready to submit' : 'All skipped') + '</h2>' +
        '<div class="sub">' + sub + '</div>' +
        '<div class="done-list">' + ok.map(function (d) {
          return '<div class="feed-row"><div class="feed-left"><span>' +
            Mock.catEmoji(d.slip.chosen) + '</span><span class="feed-desc">' +
            Mock.escapeHtml(d.slip.edit.Description || d.slip.filename) +
            ' <span class="feed-sub">' + Mock.escapeHtml(d.slip.chosen) + '</span></span></div>' +
            '<span class="feed-amt">' + (isIncomeCat(d.slip.chosen) ? '+' : '−') +
            Mock.fmtBaht(d.slip.edit.Amount) + '</span></div>';
        }).join('') + '</div></div>';
    document.getElementById('progress').textContent = '';
  }

  // Did the user change anything vs the OCR-extracted original? Drives the
  // extraction-feedback log on the Mac path (ocr_corrections.csv).
  function wasEdited(s) {
    if (s.chosen !== s.cat0) return true;
    return ['Amount', 'Date', 'Description', 'Note'].some(function (k) {
      return String(s.edit[k] || '') !== String(s.orig[k] || '');
    });
  }

  // Block an accidental navigation/refresh mid-submit (a batch is several
  // GitHub writes; leaving partway used to strand drafts.json). Mirrors the
  // live page's blockUnload.
  function blockUnload(e) { e.preventDefault(); e.returnValue = ''; return ''; }

  // Real batch gate — nothing writes until here. Reuses DataSource.submitReview
  // (local → POST /api/review/submit; github → database.csv then drafts.json
  // then best-effort archive). Idempotent + commit-time Date+Amount dedup.
  async function submit(okCount, rejected) {
    var btn = document.getElementById('submit-btn');
    if (btn.disabled) return;
    btn.disabled = true;
    window.addEventListener('beforeunload', blockUnload);

    // Skipped slips are deliberately left out of the payload: not confirmed, not
    // rejected. Excluding them means both submitReview (github) and
    // commit_decisions (local) leave their drafts untouched, so they stay in the
    // queue to revisit after this batch.
    var decs = decisions.filter(function (d) { return d.kind !== 'skip'; }).map(function (d) {
      var s = d.slip;
      var dec = {
        id: s.id, slip_path: s.slip_path, filename: s.filename,
        image_path: s.image_path, slip_type: s.slip_type,
        decision: d.kind === 'ok' ? 'confirmed' : 'rejected',
        edited: wasEdited(s),
      };
      if (dec.decision === 'confirmed') {
        dec.fields = {
          Date:        s.edit.Date || '',
          Description: s.edit.Description || '',
          Amount:      s.edit.Amount || '',
          Category:    s.chosen || '',
          Note:        s.edit.Note || '',
        };
      }
      return dec;
    });

    try {
      var data = await DataSource.submitReview(decs, function (txt) {
        btn.textContent = txt;
      });
      window.removeEventListener('beforeunload', blockUnload);
      document.getElementById('submit-bar').classList.remove('show');
      var c = (data && data.confirmed != null) ? data.confirmed : okCount;
      var r = (data && data.rejected  != null) ? data.rejected  : rejected;
      var extra = (data && data.archive_failed)
        ? ' · ' + data.archive_failed + ' image(s) left in inbox (harmless)' : '';
      var sk = decisions.filter(function (d) { return d.kind === 'skip'; }).length;
      var skTxt = sk ? ' · <b>' + sk + '</b> still in your queue' : '';
      stage.innerHTML =
        '<div class="slip-card done-box"><h2>Submitted 🎉</h2>' +
          '<div class="sub"><b>' + c + '</b> row' + (c === 1 ? '' : 's') +
          ' committed · <b>' + r + '</b> rejected' + skTxt + extra + '.</div></div>';
      document.getElementById('progress').textContent = '';
    } catch (e) {
      window.removeEventListener('beforeunload', blockUnload);
      btn.disabled = false;
      btn.textContent = 'Submit ' + okCount + ' slip' + (okCount === 1 ? '' : 's');
      Mock.softFail(stage,
        'Submit failed: ' + (e && e.message ? e.message : e) + ' — nothing was lost, try again.');
    }
  }

  // ---- bootstrap ----
  function freshEdit(s) {
    return { Amount: fieldVal(s, 'Amount'), Date: fieldVal(s, 'Date'),
             Description: fieldVal(s, 'Description'), Note: fieldVal(s, 'Note') };
  }

  // Load (or reload) the deck from the current drafts. Resets any in-progress
  // decisions — "Read slip" calls this to refresh the queue after a new OCR run.
  async function loadDeck() {
    try {
      cursor = 0; decisions = [];
      slips = await DataSource.loadDrafts();
      if (!slips.length) {
        document.getElementById('submit-bar').classList.remove('show');
        document.getElementById('progress').textContent = '';
        stage.innerHTML = '<div class="slip-card done-box"><h2>Inbox zero ✨</h2>' +
          '<div class="sub">No slips waiting for review.</div></div>';
        return;
      }
      slips.forEach(function (s) {
        s.cat0 = fieldVal(s, 'Category') || 'Other';   // blank prediction → neutral, not a wrong "Food"
        s.chosen = s.cat0;
        s.edit = freshEdit(s);
        s.orig = freshEdit(s);   // snapshot of OCR originals → drives the `edited` flag
      });
      render();
    } catch (e) {
      Mock.softFail(stage, "Couldn't load slips right now. Check your connection and reload.");
    }
  }

  // ---- "Read slip": force an OCR run now, then poll for the refreshed queue ----
  // local → POST /api/scan (background worker); github → workflow_dispatch the
  // OCR Action. Either way we poll loadDrafts until the queue grows (the Action's
  // cold start is ~1–2 min) and then re-bootstrap the deck.
  async function onReadSlip() {
    var btn = document.getElementById('read-slip');
    if (btn.disabled) return;
    var baseline = slips.length;
    btn.disabled = true; btn.textContent = 'Reading…';
    try {
      await DataSource.triggerOcr();
    } catch (e) {
      btn.disabled = false; btn.textContent = '↻ Read slip';
      Mock.softFail(stage, 'Read slip failed: ' + (e && e.message ? e.message : e));
      return;
    }
    var tries = 0, MAX = 18;   // ~3 min at 10s
    (function poll() {
      tries++;
      DataSource.loadDrafts().then(function (d) {
        if (d && d.length > baseline) {
          btn.disabled = false; btn.textContent = '↻ Read slip';
          loadDeck();
        } else if (tries >= MAX) {
          btn.disabled = false; btn.textContent = '↻ Read slip';
          document.getElementById('progress').textContent = 'no new slips yet';
        } else {
          btn.textContent = 'Reading… (' + tries + ')';
          setTimeout(poll, 10000);
        }
      }).catch(function () {
        if (tries >= MAX) { btn.disabled = false; btn.textContent = '↻ Read slip'; }
        else setTimeout(poll, 10000);
      });
    })();
  }
  document.getElementById('read-slip').addEventListener('click', onReadSlip);

  loadDeck();
})();
</script>
</body>
</html>
