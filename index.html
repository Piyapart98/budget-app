<html lang="en">
<head>

<title>Budget</title>
<!-- warm-journal home v2 (2026-06-18) — + Cards due countdown -->
<link rel="stylesheet" href="warm.css">
</head>
<body>
<div class="wrap">
  <h1 id="greet">Hello</h1>
  <div class="dateline" id="dateline"></div>

  <div class="card headline-card" id="headline">
    <div class="hl-top"><span id="hl-label">This month</span><span id="hl-pct"></span></div>
    <div class="hl-amount" id="hl-amount">…</div>
    <div class="hl-bar" id="hl-bar-wrap" style="display:none;"><div id="hl-bar"></div></div>
    <div class="hl-note" id="hl-note"></div>
  </div>

  <a class="nudge" id="nudge" href="review.html" style="display:none;">
    <span id="nudge-text">🧾 Slips to review</span><span class="chev">›</span>
  </a>

  <div class="section-head" id="cards-due-head" style="display:none;">
    <div class="section-title">Cards due</div>
    <span class="section-edit" id="cards-due-edit">Edit</span>
  </div>
  <div class="cd-list" id="cards-due" style="display:none;"></div>

  <div class="section-head" id="utils-due-head" style="display:none;">
    <div class="section-title">Utility &amp; Subs</div>
    <span class="section-edit" id="utils-due-edit">Edit</span>
  </div>
  <div class="cd-list" id="utils-due" style="display:none;"></div>

  <div class="section-title">Recent spending</div>
  <div class="card" id="feed"><div class="soft-note">Loading…</div></div>

  <div class="section-title">More</div>
  <div class="shortcuts">
    <a class="shortcut" href="review.html">📥<br>Review</a>
    <a class="shortcut" href="monthly_report.html">📊<br>Report</a>
    <a class="shortcut" href="entry_form.html">➕<br>Add entry</a>
    <a class="shortcut" href="edit_log.html">📝<br>Edit log</a>
    <a class="shortcut" href="roong_settlement.html">💛<br>Settlement</a>
    <a class="shortcut" href="statement_verify.html">✅<br>Verify</a>
  </div>
</div>
<script src="data-source.js"></script>
<script src="warm-shared.js"></script>
<script>
(function () {
  'use strict';
  document.getElementById('greet').textContent = Mock.greeting();
  document.getElementById('dateline').textContent = Mock.dateline();

  // Headline card + journal feed from database.csv (read-only).
  (async function () {
    var feed = document.getElementById('feed');
    try {
      var cfgP = DataSource.loadConfig().catch(function () { return null; });
      var goalsP = DataSource.loadGoals().catch(function () { return {}; });
      var rows = await DataSource.loadDatabase();
      var cfg = await cfgP, goals = await goalsP;
      var isIncome = Mock.incomeTester(cfg);
      var live = rows.filter(function (r) { return !Mock.isDeleted(r); });

      // This month's spending
      var mk = Mock.thisMonthKey();
      var spent = 0;
      live.forEach(function (r) {
        if (Mock.monthKey(r.Date) === mk && !isIncome(r.Category)) {
          spent += parseFloat(r.Amount) || 0;
        }
      });
      document.getElementById('hl-amount').textContent = Mock.fmtBaht(spent);
      var now = new Date();
      var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      var daysLeft = daysInMonth - now.getDate();
      var budget = (goals && Number(goals.monthly_total)) || 0;
      if (budget > 0) {
        var pct = Math.min(100, Math.round(spent / budget * 100));
        document.getElementById('hl-pct').textContent = pct + '% of budget';
        document.getElementById('hl-bar-wrap').style.display = '';
        document.getElementById('hl-bar').style.width = pct + '%';
        document.getElementById('hl-note').textContent =
          Mock.fmtBaht(Math.max(0, budget - spent)) + ' left · ' + daysLeft + ' days to go';
      } else {
        document.getElementById('hl-note').textContent = daysLeft + ' days left this month';
      }

      // Journal feed — last 5 transactions by Date then position.
      var recent = live.slice().sort(function (a, b) {
        return a.Date < b.Date ? 1 : a.Date > b.Date ? -1 : 0;
      }).slice(0, 5);
      if (!recent.length) {
        Mock.softFail(feed, 'No transactions yet this month.');
      } else {
        feed.innerHTML = recent.map(function (r) {
          var inc = isIncome(r.Category);
          // Description is the real label now (Note is free text, often blank).
          var label = r.Description || r.Note || r.Category || '—';
          return '<div class="feed-row">' +
            '<div class="feed-left"><span>' + Mock.catEmoji(r.Category) + '</span>' +
            '<span class="feed-desc">' + Mock.escapeHtml(label) +
            ' <span class="feed-sub">' + Mock.escapeHtml(r.Date) + '</span></span></div>' +
            '<span class="feed-amt' + (inc ? ' income' : '') + '">' +
            (inc ? '+' : '−') + Mock.fmtBaht(r.Amount) + '</span></div>';
        }).join('');
      }
    } catch (e) {
      document.getElementById('hl-amount').textContent = '—';
      document.getElementById('hl-note').textContent = "Couldn't load spending right now";
      Mock.softFail(feed, "Couldn't load recent spending right now.");
    }
  })();

  // Slips nudge — live drafts count, hidden at 0 or on failure (Review is also
  // always reachable from the "More" grid).
  (async function () {
    try {
      var drafts = await DataSource.loadDrafts();
      var n = (drafts || []).length;
      if (n > 0) {
        document.getElementById('nudge-text').textContent =
          '🧾 ' + n + ' slip' + (n === 1 ? '' : 's') + ' to review';
        document.getElementById('nudge').style.display = 'flex';
      }
    } catch (e) { /* stay hidden */ }
  })();
})();
</script>

<!-- Bottom sheet: set/change a due day, add/edit a utility, or track a card -->
<div class="sheet-back" id="cd-sheet-back">
  <div class="sheet">
    <h3 id="cd-sheet-title">When is this due?</h3>
    <p id="cd-sheet-desc">Pick the day of the month the payment is due.</p>
    <div id="cd-sheet-fields"></div>
    <div class="day-grid" id="cd-day-grid"></div>
    <div class="sheet-preview" id="cd-sheet-preview"></div>
    <div class="sheet-actions">
      <button class="btn-remove" id="cd-sheet-remove" style="display:none;">Remove</button>
      <button class="btn-cancel" id="cd-sheet-cancel">Cancel</button>
      <button class="btn-save" id="cd-sheet-save">Save</button>
    </div>
  </div>
</div>

<script>
/* Homepage trackers — Cards due + Utility & Subs. Both count down the same way
   (due_day + paid_for; Mark paid advances paid_for to the next cycle; the badge
   auto-reverts ~SOON days before the next due date). Cards come from cards.json /
   card_cycles.json (+ a statement-due override from verify.json); utilities are
   standalone items in utilities.json. Each section has an Edit toggle to add or
   remove items. All derived live. */
(function () {
  'use strict';
  var SOON = 5;            // promote (red) when due within this many days
  var DAY = 86400000;

  // ---- date helpers (local midnight, day-of-month occurrences) ----
  function pad(n) { return String(n).padStart(2, '0'); }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function occ(day, y, m) { return new Date(y, m, Math.min(day, daysInMonth(y, m))); }
  function firstOnOrAfter(day, from) {
    var y = from.getFullYear(), m = from.getMonth(), c = occ(day, y, m);
    if (c < from) { m++; if (m > 11) { m = 0; y++; } c = occ(day, y, m); }
    return c;
  }
  function firstStrictlyAfter(day, from) {
    var y = from.getFullYear(), m = from.getMonth(), c = occ(day, y, m);
    while (c <= from) { m++; if (m > 11) { m = 0; y++; } c = occ(day, y, m); }
    return c;
  }
  function prevOnOrBefore(day, today) {
    var y = today.getFullYear(), m = today.getMonth(), c = occ(day, y, m);
    while (c > today) { m--; if (m < 0) { m = 11; y--; } c = occ(day, y, m); }
    return c;
  }
  function fmtDue(d) {
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function esc(s) { return Mock.escapeHtml(s); }

  var TODAY = midnight(new Date());

  // ---- data ----
  var cardsCache = [];      // [{last4, name}]
  var cyclesCache = {};     // {last4: {due_day, paid_for}}
  var stmtByCard = {};      // {last4: {due_date, statement_total}}
  var utilsCache = [];      // [{id, name, amount, due_day, paid_for}]
  var editMode = { cards: false, utils: false };
  var stateBy = { cards: {}, utils: {} };

  // ---- normalize each tracker's items into one shape for the engine ----
  function cardEntries() {
    return cardsCache.map(function (c) {
      var cy = cyclesCache[c.last4] || {};
      return { tracker: 'cards', key: c.last4, name: (c.name || ('*' + c.last4)), emoji: '💳',
        dueDay: (cy.due_day != null && cy.due_day !== '') ? Number(cy.due_day) : null,
        paidFor: cy.paid_for || null, amount: null, stmt: stmtByCard[c.last4] || null };
    });
  }
  function utilEntries() {
    return utilsCache.map(function (u) {
      return { tracker: 'utils', key: String(u.id), name: (u.name || 'Untitled'), emoji: '🔁',
        dueDay: (u.due_day != null && u.due_day !== '') ? Number(u.due_day) : null,
        paidFor: u.paid_for || null,
        amount: (u.amount != null && u.amount !== '') ? u.amount : null, stmt: null };
    });
  }

  // ---- countdown engine (shared by both trackers) ----
  function computeState(e) {
    var dueDay = e.dueDay, paidFor = e.paidFor || null, stmt = e.stmt || null;
    var s = { tracker: e.tracker, key: e.key, name: e.name, emoji: e.emoji, dueDay: dueDay, amount: e.amount };
    // Statement override (cards only) — while the statement's due date is unpaid.
    if (stmt && stmt.due_date && (!paidFor || stmt.due_date > paidFor)) {
      s.dueTarget = parseISO(stmt.due_date);
      s.amount = (stmt.statement_total != null) ? stmt.statement_total : null;
      s.fromStatement = true;
    } else if (dueDay) {
      s.dueTarget = paidFor ? firstStrictlyAfter(dueDay, parseISO(paidFor))
                            : firstOnOrAfter(dueDay, TODAY);
    } else {
      s.kind = 'set'; s.sortKey = 1e9; return s;
    }
    s.days = Math.round((midnight(s.dueTarget) - TODAY) / DAY);
    var prevISO = dueDay ? isoOf(prevOnOrBefore(dueDay, TODAY)) : null;
    var paidDisplay = !s.fromStatement && paidFor && prevISO && paidFor >= prevISO && s.days > SOON;
    if (paidDisplay)        { s.kind = 'paid';     s.sortKey = 1e8 + s.days; }
    else if (s.days < 0)    { s.kind = 'overdue';  s.sortKey = s.days; }
    else if (s.days <= SOON){ s.kind = 'promoted'; s.sortKey = s.days; }
    else                    { s.kind = 'calm';     s.sortKey = s.days; }
    return s;
  }

  // ---- row rendering ----
  function shell(cls, s, main, right) {
    return '<div class="cd-card ' + cls + '" data-tracker="' + s.tracker + '" data-key="' + esc(s.key) + '">' +
      '<span class="cd-emoji">' + s.emoji + '</span>' +
      '<div class="cd-main"><div class="cd-name">' + esc(s.name) + '</div>' + main + '</div>' +
      '<div class="cd-right">' + right + '</div></div>';
  }
  function rowHtml(s, edit) {
    var dk = 'data-tracker="' + s.tracker + '" data-key="' + esc(s.key) + '"';
    if (edit) {
      var amtE = (s.amount != null) ? '<span class="cd-amt">' + Mock.fmtBaht(s.amount) + '</span> · ' : '';
      return '<div class="cd-card cd-editing" ' + dk + '>' +
        '<button class="cd-remove" data-action="remove" ' + dk + ' aria-label="remove">✕</button>' +
        '<span class="cd-emoji">' + s.emoji + '</span>' +
        '<div class="cd-main"><div class="cd-name">' + esc(s.name) + '</div>' +
        '<div class="cd-sub">' + amtE + 'due ' + fmtDue(s.dueTarget) + '</div></div></div>';
    }
    if (s.kind === 'paid') {
      return shell('cd-done', s, '<div class="cd-sub">next due ' + fmtDue(s.dueTarget) + '</div>',
        '<span class="cd-status" data-action="undo" ' + dk + ' title="tap to undo">✓ paid</span>');
    }
    var amt = (s.amount != null) ? '<span class="cd-amt">' + Mock.fmtBaht(s.amount) + '</span> · ' : '';
    var sub = '<div class="cd-sub">' + amt + 'due ' + fmtDue(s.dueTarget) +
      ' <button class="cd-edit" data-action="edit" ' + dk + ' aria-label="edit">✎</button></div>';
    var count = s.days < 0 ? 'overdue by ' + (-s.days) + ' day' + (s.days === -1 ? '' : 's')
      : s.days === 0 ? 'due today'
      : s.days === 1 ? 'due tomorrow'
      : 'in ' + s.days + ' days';
    var right = '<span class="cd-count">' + count + '</span>' +
      '<button class="cd-paid-btn" data-action="paid" ' + dk + '>Mark paid</button>';
    var cls = s.kind === 'overdue' ? 'cd-overdue' : s.kind === 'promoted' ? 'cd-promoted' : 'cd-calm';
    return shell(cls, s, sub, right);
  }

  // ---- tracker config + render ----
  var TRACKERS = {
    cards: { id: 'cards', addLabel: '+ Add card', entries: cardEntries,
      headEl: document.getElementById('cards-due-head'),
      listEl: document.getElementById('cards-due'),
      toggleEl: document.getElementById('cards-due-edit') },
    utils: { id: 'utils', addLabel: '+ Add utility', entries: utilEntries,
      headEl: document.getElementById('utils-due-head'),
      listEl: document.getElementById('utils-due'),
      toggleEl: document.getElementById('utils-due-edit') }
  };

  function renderTracker(cfg) {
    var states = cfg.entries().map(computeState)
      .filter(function (s) { return s.kind !== 'set'; })   // only tracked items
      .sort(function (a, b) { return a.sortKey - b.sortKey; });
    stateBy[cfg.id] = {};
    states.forEach(function (s) { stateBy[cfg.id][s.key] = s; });
    var edit = editMode[cfg.id];
    cfg.headEl.style.display = '';
    cfg.listEl.style.display = '';
    cfg.toggleEl.textContent = edit ? 'Done' : 'Edit';
    var html = states.map(function (s) { return rowHtml(s, edit); }).join('');
    if (edit) {
      html += '<div class="cd-add" data-action="add" data-tracker="' + cfg.id + '">' + cfg.addLabel + '</div>';
    } else if (!states.length) {
      html = '<div class="cd-empty">Nothing tracked yet — tap Edit to add.</div>';
    }
    cfg.listEl.innerHTML = html;
  }
  function render() { renderTracker(TRACKERS.cards); renderTracker(TRACKERS.utils); }

  // ---- mutations (optimistic, revert on failure) ----
  function findUtil(id) {
    for (var i = 0; i < utilsCache.length; i++) {
      if (String(utilsCache[i].id) === String(id)) return utilsCache[i];
    }
    return null;
  }
  async function persistCycle(l4, patch, prev) {
    try { await DataSource.saveCardCycle(l4, patch); }
    catch (err) {
      if (prev === undefined) delete cyclesCache[l4]; else cyclesCache[l4] = prev;
      render();
      alert("Couldn't save that just now: " + (err && err.message ? err.message : err));
    }
  }
  async function persistUtilSave(patch, prevList) {
    try { utilsCache = (await DataSource.saveUtility(patch)) || utilsCache; render(); }
    catch (err) {
      utilsCache = prevList; render();
      alert("Couldn't save that just now: " + (err && err.message ? err.message : err));
    }
  }

  function markPaid(tracker, key) {
    var s = stateBy[tracker][key]; if (!s || !s.dueTarget) return;
    var iso = isoOf(midnight(s.dueTarget));
    if (tracker === 'cards') {
      var prev = cyclesCache[key] ? Object.assign({}, cyclesCache[key]) : undefined;
      cyclesCache[key] = Object.assign({}, cyclesCache[key], { paid_for: iso }); render();
      persistCycle(key, { paid_for: iso }, prev);
    } else {
      var u = findUtil(key); if (!u) return;
      var prevList = utilsCache.map(function (x) { return Object.assign({}, x); });
      u.paid_for = iso; render();
      persistUtilSave({ id: key, paid_for: iso }, prevList);
    }
  }
  function undoPaid(tracker, key) {
    if (tracker === 'cards') {
      var prev = cyclesCache[key] ? Object.assign({}, cyclesCache[key]) : undefined;
      var nc = Object.assign({}, cyclesCache[key]); delete nc.paid_for; cyclesCache[key] = nc; render();
      persistCycle(key, { paid_for: null }, prev);
    } else {
      var u = findUtil(key); if (!u) return;
      var prevList = utilsCache.map(function (x) { return Object.assign({}, x); });
      delete u.paid_for; render();
      persistUtilSave({ id: key, paid_for: null }, prevList);
    }
  }
  function removeItem(tracker, key) {
    if (tracker === 'cards') {
      // Remove from the countdown only — clears due_day/paid_for but keeps the
      // card in cards.json so slip OCR auto-detect is unaffected.
      var prev = cyclesCache[key] ? Object.assign({}, cyclesCache[key]) : undefined;
      var nc = Object.assign({}, cyclesCache[key]); delete nc.due_day; delete nc.paid_for;
      cyclesCache[key] = nc; render();
      persistCycle(key, { due_day: null, paid_for: null }, prev);
    } else {
      var prevList = utilsCache.map(function (x) { return Object.assign({}, x); });
      utilsCache = utilsCache.filter(function (u) { return String(u.id) !== String(key); }); render();
      (async function () {
        try { utilsCache = (await DataSource.deleteUtility(key)) || utilsCache; render(); }
        catch (err) {
          utilsCache = prevList; render();
          alert("Couldn't remove that just now: " + (err && err.message ? err.message : err));
        }
      })();
    }
  }

  // ---- toggles + delegated click handling ----
  Object.keys(TRACKERS).forEach(function (id) {
    var cfg = TRACKERS[id];
    cfg.toggleEl.addEventListener('click', function () { editMode[id] = !editMode[id]; renderTracker(cfg); });
    cfg.listEl.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action]'); if (!t) return;
      var act = t.getAttribute('data-action');
      var tracker = t.getAttribute('data-tracker'), key = t.getAttribute('data-key');
      if (act === 'paid') markPaid(tracker, key);
      else if (act === 'undo') undoPaid(tracker, key);
      else if (act === 'remove') removeItem(tracker, key);
      else if (act === 'add') openAddSheet(tracker);
      else if (act === 'edit') openEditSheet(tracker, key);
    });
  });

  // ---- bottom sheet (set due day / add-edit utility / track a card) ----
  var sheetBack = document.getElementById('cd-sheet-back');
  var grid = document.getElementById('cd-day-grid');
  var titleEl = document.getElementById('cd-sheet-title');
  var descEl = document.getElementById('cd-sheet-desc');
  var fieldsEl = document.getElementById('cd-sheet-fields');
  var previewEl = document.getElementById('cd-sheet-preview');
  var removeBtn = document.getElementById('cd-sheet-remove');
  var saveBtn = document.getElementById('cd-sheet-save');
  var sheet = null;        // active sheet state, or null when closed

  function buildDayGrid() {
    grid.innerHTML = '';
    for (var d = 1; d <= 28; d++) {
      var cell = document.createElement('div');
      cell.className = 'day-cell'; cell.textContent = d; cell.setAttribute('data-day', d);
      grid.appendChild(cell);
    }
  }
  function refreshGrid() {
    Array.prototype.forEach.call(grid.querySelectorAll('.day-cell'), function (cell) {
      cell.classList.toggle('sel', Number(cell.getAttribute('data-day')) === sheet.day);
    });
    if (sheet.day) {
      var due = firstOnOrAfter(sheet.day, TODAY);
      var days = Math.round((midnight(due) - TODAY) / DAY);
      previewEl.textContent = 'Next due ' + fmtDue(due) + ' — ' + (days <= SOON ? '⚠ ' : '') +
        (days === 0 ? 'due today' : 'in ' + days + ' day' + (days === 1 ? '' : 's')) + '.';
    } else { previewEl.textContent = 'Pick a day.'; }
  }
  function utilFields() {
    return '<label class="sheet-field"><span>Name</span>' +
      '<input id="cd-f-name" type="text" placeholder="e.g. Netflix" value="' + esc(sheet.name || '') + '"></label>' +
      '<label class="sheet-field"><span>Amount (฿)</span>' +
      '<input id="cd-f-amount" type="number" inputmode="decimal" placeholder="e.g. 419" value="' +
      esc(sheet.amount == null ? '' : sheet.amount) + '"></label>';
  }
  function cardChips() {
    var tracked = {};
    Object.keys(cyclesCache).forEach(function (l4) { if (cyclesCache[l4] && cyclesCache[l4].due_day) tracked[l4] = true; });
    var chips = cardsCache.filter(function (c) { return !tracked[c.last4]; }).map(function (c) {
      return '<span class="chip' + (sheet.cardL4 === c.last4 ? ' selected' : '') + '" data-l4="' +
        esc(c.last4) + '">' + esc(c.name || ('*' + c.last4)) + '</span>';
    }).join('');
    chips += '<span class="chip" data-l4="__new__">➕ New card</span>';
    return '<div class="sheet-chips">' + chips + '</div>';
  }

  function openSheet() { buildDayGrid(); refreshGrid(); sheetBack.classList.add('open'); }
  function closeSheet() { sheetBack.classList.remove('open'); sheet = null; }

  function openEditSheet(tracker, key) {
    var s = stateBy[tracker][key];
    if (tracker === 'cards') {
      var cy = cyclesCache[key] || {};
      sheet = { mode: 'card-day', tracker: 'cards', key: key,
        day: (cy.due_day != null && cy.due_day !== '') ? Number(cy.due_day) : null };
      titleEl.textContent = 'When is ' + ((s && s.name) || ('*' + key)) + ' due?';
      descEl.textContent = 'Pick the day of the month the payment is due.';
      fieldsEl.innerHTML = '';
      removeBtn.style.display = 'none';
      saveBtn.textContent = 'Save due day';
    } else {
      var u = findUtil(key) || {};
      sheet = { mode: 'util-edit', tracker: 'utils', key: key,
        day: (u.due_day != null && u.due_day !== '') ? Number(u.due_day) : null,
        name: u.name || '', amount: (u.amount == null ? '' : u.amount) };
      titleEl.textContent = 'Edit ' + (u.name || 'utility');
      descEl.textContent = 'Name, amount, and the day it is due each month.';
      fieldsEl.innerHTML = utilFields();
      removeBtn.style.display = '';
      saveBtn.textContent = 'Save';
    }
    openSheet();
  }
  function openAddSheet(tracker) {
    if (tracker === 'cards') {
      sheet = { mode: 'card-add', tracker: 'cards', key: null, day: null, cardL4: null };
      titleEl.textContent = 'Track a card';
      descEl.textContent = 'Pick a card and the day its payment is due.';
      fieldsEl.innerHTML = cardChips();
      removeBtn.style.display = 'none';
      saveBtn.textContent = 'Save due day';
    } else {
      sheet = { mode: 'util-add', tracker: 'utils', key: null, day: null, name: '', amount: '' };
      titleEl.textContent = 'Add utility';
      descEl.textContent = 'Name, amount, and the day it is due each month.';
      fieldsEl.innerHTML = utilFields();
      removeBtn.style.display = 'none';
      saveBtn.textContent = 'Add utility';
    }
    openSheet();
  }

  // keep text inputs / card chips in sync with sheet state
  fieldsEl.addEventListener('input', function (e) {
    if (!sheet) return;
    if (e.target.id === 'cd-f-name') sheet.name = e.target.value;
    else if (e.target.id === 'cd-f-amount') sheet.amount = e.target.value;
  });
  fieldsEl.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip'); if (!chip || !sheet) return;
    var l4 = chip.getAttribute('data-l4');
    if (l4 === '__new__') { addNewCard(); return; }
    sheet.cardL4 = l4;
    Array.prototype.forEach.call(fieldsEl.querySelectorAll('.chip'), function (c) {
      c.classList.toggle('selected', c.getAttribute('data-l4') === l4);
    });
  });
  async function addNewCard() {
    var name = window.prompt('New card name (e.g. Krungthai Travel):');
    if (!name || !name.trim()) return;
    var last4 = window.prompt('Card last-4 digits (for auto-detect):');
    if (!last4 || !/^\d{4}$/.test(last4.trim())) { alert('Last-4 must be exactly 4 digits.'); return; }
    try {
      cardsCache = (await DataSource.saveCard(last4.trim(), name.trim())) || cardsCache;
      if (sheet) { sheet.cardL4 = last4.trim(); fieldsEl.innerHTML = cardChips(); }
    } catch (err) { alert('Add card failed: ' + (err && err.message ? err.message : err)); }
  }

  grid.addEventListener('click', function (e) {
    var cell = e.target.closest('.day-cell'); if (!cell || !sheet) return;
    sheet.day = Number(cell.getAttribute('data-day')); refreshGrid();
  });
  document.getElementById('cd-sheet-cancel').addEventListener('click', closeSheet);
  sheetBack.addEventListener('click', function (e) { if (e.target === sheetBack) closeSheet(); });
  removeBtn.addEventListener('click', function () {
    if (!sheet) { closeSheet(); return; }
    var tracker = sheet.tracker, key = sheet.key; closeSheet();
    if (key != null) removeItem(tracker, key);
  });
  saveBtn.addEventListener('click', function () {
    if (!sheet) { closeSheet(); return; }
    var m = sheet.mode;
    if (m === 'card-day' || m === 'card-add') {
      var l4 = (m === 'card-add') ? sheet.cardL4 : sheet.key;
      if (!l4) { alert('Pick a card.'); return; }
      if (!sheet.day) { alert('Pick a due day.'); return; }
      var day = sheet.day;
      var prev = cyclesCache[l4] ? Object.assign({}, cyclesCache[l4]) : undefined;
      var nc = Object.assign({}, cyclesCache[l4]); nc.due_day = day; delete nc.paid_for; cyclesCache[l4] = nc;
      closeSheet(); render();
      persistCycle(l4, { due_day: day, paid_for: null }, prev);
    } else {  // util-add / util-edit
      var nm = (sheet.name || '').trim();
      if (!nm) { alert('Name is required.'); return; }
      if (!sheet.day) { alert('Pick a due day.'); return; }
      var patch = { name: nm, amount: (sheet.amount === '' || sheet.amount == null) ? '' : sheet.amount, due_day: sheet.day };
      if (sheet.key != null) patch.id = sheet.key;
      var prevList = utilsCache.map(function (x) { return Object.assign({}, x); });
      closeSheet();
      persistUtilSave(patch, prevList);
    }
  });

  // ---- load ----
  (async function () {
    try {
      var cardsP = DataSource.loadCards().catch(function () { return []; });
      var cyclesP = DataSource.loadCardCycles().catch(function () { return {}; });
      var utilsP = DataSource.loadUtilities().catch(function () { return []; });
      var verP = DataSource.loadVerification().catch(function () { return { cards: [] }; });
      cardsCache = (await cardsP) || [];
      cyclesCache = (await cyclesP) || {};
      utilsCache = (await utilsP) || [];
      var ver = await verP;
      var vcards = (ver && ver.cards) || [];
      stmtByCard = {};
      vcards.forEach(function (c) {
        if (c && c.card_last4) stmtByCard[c.card_last4] = { due_date: c.due_date, statement_total: c.statement_total };
      });
      render();
    } catch (e) { try { render(); } catch (_) {} }
  })();
})();
</script>
</body>
</html>
