<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  :root {
    --bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;
    --text:#1a1917;--text-muted:#6b6860;--text-faint:#a8a59e;
    --green:#1a6b3c;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:480px;margin:0 auto;padding:40px 20px;}
  h1{font-size:24px;margin-bottom:4px;font-weight:500;}
  .sub{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-bottom:28px;}
  a.tile{display:flex;justify-content:space-between;align-items:center;
         padding:18px 18px;margin:10px 0;background:var(--surface);
         border:1px solid var(--border);border-radius:12px;
         text-decoration:none;color:var(--text);font-weight:500;}
  a.tile:active{background:var(--bg);}
  .arrow{color:var(--text-faint);font-family:var(--mono);}
  .meta{margin-top:24px;font-size:11px;color:var(--text-faint);
        font-family:var(--mono);line-height:1.7;}
</style>
</head>
