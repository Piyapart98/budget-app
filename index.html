<body>
<div class="wrap">
  <h1 id="greet">Hello</h1>
  <div class="dateline" id="dateline"></div>

  <div class="card headline-card" id="headline">
    <div class="hl-top"><span id="hl-label">This month</span><span id="hl-pct"></span></div>
    <div class="hl-amount" id="hl-amount">…</div>
    <div class="hl-bar" id="hl-bar-wrap" style="display:none;"><div id="hl-bar"></div></div>
    <div class="hl-note" id="hl-note"></div>
  </div>

  <a class="nudge" id="nudge" href="review.html" style="display:none;">
    <span id="nudge-text">🧾 Slips to review</span><span class="chev">›</span>
  </a>

  <div class="section-title sec-head" id="cards-due-title" style="display:none;"><span>Upcoming</span>
    <span class="edit-link" id="cd-edit-toggle">Edit</span></div>
  <div class="cd-list" id="cards-due" style="display:none;"></div>

  <div class="section-title">Recent spending</div>
  <div class="card" id="feed"><div class="soft-note">Loading…</div></div>

  <div class="section-title">More</div>
  <div class="shortcuts">
    <a class="shortcut" href="review.html">📥<br>Review</a>
    <a class="shortcut" href="monthly_report.html">📊<br>Report</a>
    <a class="shortcut" href="entry_form.html">➕<br>Add entry</a>
    <a class="shortcut" href="edit_log.html">📝<br>Edit log</a>
    <a class="shortcut" href="roong_settlement.html">💛<br>Settlement</a>
    <a class="shortcut" href="statement_verify.html">✅<br>Verify</a>
  </div>

  <!-- Warm Journal v2 trial (2026-08-01). The v2 pages live under /v2/ and
       replace nothing here; this is the only line on any live page that knows
       they exist. Delete it to end the trial. -->
  <a href="v2/index.html" style="display:block;text-align:center;font-size:12px;
     color:var(--text-faint);text-decoration:none;margin-top:22px">
    Try the new layout <span style="border-bottom:1px solid #ddd6c8">v2 →</span></a>
</div>
<script src="data-source.js"></script>
<script src="warm-shared.js"></script>
<script>
(function () {
  'use strict';
  document.getElementById('greet').textContent = Mock.greeting();
  document.getElementById('dateline').textContent = Mock.dateline();

  // Headline card + journal feed from database.csv (read-only).
  (async function () {
    var feed = document.getElementById('feed');
    try {
      var cfgP = DataSource.loadConfig().catch(function () { return null; });
      var goalsP = DataSource.loadGoals().catch(function () { return {}; });
      var rows = await DataSource.loadDatabase();
      var cfg = await cfgP, goals = await goalsP;
      var isIncome = Mock.incomeTester(cfg), isSaving = Mock.savingTester(cfg);
      // Income or saving: excluded from spent, shown "+" in the feed.
      var isInflow = function (c) { return isIncome(c) || isSaving(c); };
      var live = rows.filter(function (r) { return !Mock.isDeleted(r); });

      // This month's REAL spending — same rule as the monthly report (spec
      // 2026-07-19): flagged rows (With Roong / Settle tick) count net of the
      // share owed back — stamped roong_share, else a 50% estimate.
      var mk = Mock.thisMonthKey();
      var spent = 0;
      live.forEach(function (r) {
        if (Mock.monthKey(r.Date) === mk && !isInflow(r.Category)) {
          var amt = parseFloat(r.Amount) || 0;
          var flagged = (r.Category || '').trim() === 'With Roong' ||
                        String(r.Settle || '').toLowerCase() === 'true';
          if (flagged) {
            // Stamped share is authoritative, an explicit 0 included; the 50%
            // estimate applies only while roong_share is blank (not requested).
            var raw = String(r.roong_share == null ? '' : r.roong_share).trim();
            amt -= (raw !== '' && !isNaN(parseFloat(raw)))
              ? Math.min(Math.max(parseFloat(raw), 0), amt)
              : amt * 0.5;
          }
          spent += amt;
        }
      });
      document.getElementById('hl-amount').textContent = Mock.fmtBaht(spent);
      var now = new Date();
      var daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      var daysLeft = daysInMonth - now.getDate();
      var budget = (goals && Number(goals.monthly_total)) || 0;
      if (budget > 0) {
        var pct = Math.min(100, Math.round(spent / budget * 100));
        document.getElementById('hl-pct').textContent = pct + '% of budget';
        document.getElementById('hl-bar-wrap').style.display = '';
        document.getElementById('hl-bar').style.width = pct + '%';
        document.getElementById('hl-note').textContent =
          Mock.fmtBaht(Math.max(0, budget - spent)) + ' left · ' + daysLeft + ' days to go';
      } else {
        document.getElementById('hl-note').textContent = daysLeft + ' days left this month';
      }

      // Journal feed — last 5 transactions by Date then position.
      var recent = live.slice().sort(function (a, b) {
        return a.Date < b.Date ? 1 : a.Date > b.Date ? -1 : 0;
      }).slice(0, 5);
      if (!recent.length) {
        Mock.softFail(feed, 'No transactions yet this month.');
      } else {
        feed.innerHTML = recent.map(function (r) {
          var inc = isInflow(r.Category);
          // Description is the real label now (Note is free text, often blank).
          var label = r.Description || r.Note || r.Category || '—';
          return '<div class="feed-row">' +
            '<div class="feed-left"><span>' + Mock.catEmoji(r.Category) + '</span>' +
            '<span class="feed-desc">' + Mock.escapeHtml(label) +
            ' <span class="feed-sub">' + Mock.escapeHtml(r.Date) + '</span></span></div>' +
            '<span class="feed-amt' + (inc ? ' income' : '') + '">' +
            (inc ? '+' : '−') + Mock.fmtBaht(r.Amount) + '</span></div>';
        }).join('');
      }
    } catch (e) {
      document.getElementById('hl-amount').textContent = '—';
      document.getElementById('hl-note').textContent = "Couldn't load spending right now";
      Mock.softFail(feed, "Couldn't load recent spending right now.");
    }
  })();

  // Slips nudge — live drafts count, hidden at 0 or on failure (Review is also
  // always reachable from the "More" grid).
  (async function () {
    try {
      var drafts = await DataSource.loadDrafts();
      var n = (drafts || []).length;
      if (n > 0) {
        document.getElementById('nudge-text').textContent =
          '🧾 ' + n + ' slip' + (n === 1 ? '' : 's') + ' to review';
        document.getElementById('nudge').style.display = 'flex';
      }
    } catch (e) { /* stay hidden */ }
  })();
})();
</script>

<!-- Bottom sheet: set/change a card's due day, or add/edit a reminder
     (subscription/utility) — the name field only shows for reminders. -->
<div class="sheet-back" id="cd-sheet-back">
  <div class="sheet">
    <h3 id="cd-sheet-title">When is this card due?</h3>
    <p id="cd-sheet-hint">Pick the day of the month the payment is due.</p>
    <div class="emoji-row" id="cd-sheet-emoji-row" style="display:none;">
      <input class="emoji-box" id="cd-sheet-emoji" type="text" maxlength="8"
             placeholder="&#x1F501;" aria-label="Reminder emoji">
    </div>
    <input class="sheet-name" id="cd-sheet-name" type="text"
           placeholder="e.g. Netflix, Electricity" style="display:none;">
    <div class="day-grid" id="cd-day-grid"></div>
    <div class="sheet-preview" id="cd-sheet-preview"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cd-sheet-cancel">Cancel</button>
      <button class="btn-save" id="cd-sheet-save">Save due day</button>
    </div>
  </div>
</div>

<script>
/* Upcoming — due-date countdowns for cards AND recurring reminders
   (subscriptions/utilities), merged in one list sorted by urgency.
   Cards: hybrid source — a current statement's parsed due_date + balance when
   available, else a manually-set due day (card_cycles.json). Reminders:
   standalone {id, name, due_day, emoji?, paid_for} items in utilities.json.
   Rollover rule is "overdue until paid" — a passed due date stays overdue until
   the user taps Mark paid (which advances paid_for to the next cycle). The
   Mark-paid button appears within ACT days of due; red styling within SOON. */
(function () {
  'use strict';
  var listEl  = document.getElementById('cards-due');
  var titleEl = document.getElementById('cards-due-title');
  var editBtn = document.getElementById('cd-edit-toggle');
  var SOON = 5;            // promote (red) when due within this many days
  var ACT  = 14;           // Mark-paid button window; paid rows wake this early
  var DAY = 86400000;

  // ---- date helpers (local midnight, day-of-month occurrences) ----
  function pad(n) { return String(n).padStart(2, '0'); }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function occ(day, y, m) { return new Date(y, m, Math.min(day, daysInMonth(y, m))); }
  function firstOnOrAfter(day, from) {
    var y = from.getFullYear(), m = from.getMonth(), c = occ(day, y, m);
    if (c < from) { m++; if (m > 11) { m = 0; y++; } c = occ(day, y, m); }
    return c;
  }
  function firstStrictlyAfter(day, from) {
    var y = from.getFullYear(), m = from.getMonth(), c = occ(day, y, m);
    while (c <= from) { m++; if (m > 11) { m = 0; y++; } c = occ(day, y, m); }
    return c;
  }
  function prevOnOrBefore(day, today) {
    var y = today.getFullYear(), m = today.getMonth(), c = occ(day, y, m);
    while (c > today) { m--; if (m < 0) { m = 11; y--; } c = occ(day, y, m); }
    return c;
  }
  function fmtDue(d) {
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  var TODAY = midnight(new Date());
  var cardsCache = [];      // [{last4, name}]
  var cyclesCache = {};     // {last4: {due_day, paid_for}}
  var remsCache = [];       // [{id, name, due_day, paid_for}]
  var stmtByCard = {};      // {last4: {due_date, statement_total}}
  var stateByKey = {};      // last computed state per row key (for click handlers)
  var editMode = false;

  // Shared cycle math for both kinds. stmt is card-only (statement override).
  function fillCycle(s, dueDay, paidFor, stmt) {
    if (stmt && stmt.due_date && (!paidFor || stmt.due_date > paidFor)) {
      s.dueTarget = parseISO(stmt.due_date);
      s.amount = (stmt.statement_total != null) ? stmt.statement_total : null;
      s.fromStatement = true;
    } else if (dueDay) {
      s.dueTarget = paidFor ? firstStrictlyAfter(dueDay, parseISO(paidFor))
                            : firstOnOrAfter(dueDay, TODAY);
      s.amount = null;
    } else {
      s.kind = 'set'; s.sortKey = 1e9; return s;
    }

    s.days = Math.round((midnight(s.dueTarget) - TODAY) / DAY);

    // Paid display: the latest (or upcoming) bill is settled and the next one
    // isn't within the actionable window. Never when a statement says the
    // current bill is unpaid.
    var prevISO = dueDay ? isoOf(prevOnOrBefore(dueDay, TODAY)) : null;
    var paidDisplay = !s.fromStatement && paidFor && prevISO && paidFor >= prevISO && s.days > ACT;

    if (paidDisplay)        { s.kind = 'paid';     s.sortKey = 1e8 + s.days; }
    else if (s.days < 0)    { s.kind = 'overdue';  s.sortKey = s.days; }
    else if (s.days <= SOON){ s.kind = 'promoted'; s.sortKey = s.days; }
    else                    { s.kind = 'calm';     s.sortKey = s.days; }
    return s;
  }

  function cardState(card) {
    var cy = cyclesCache[card.last4] || {};
    var dueDay = (cy.due_day != null && cy.due_day !== '') ? Number(cy.due_day) : null;
    var s = { type: 'card', key: card.last4, name: card.name || ('*' + card.last4),
              emoji: '\uD83D\uDCB3', dueDay: dueDay };
    return fillCycle(s, dueDay, cy.paid_for || null, stmtByCard[card.last4] || null);
  }
  function remState(rem) {
    var dueDay = (rem.due_day != null && rem.due_day !== '') ? Number(rem.due_day) : null;
    var s = { type: 'rem', key: String(rem.id), name: rem.name || '(unnamed)',
              emoji: rem.emoji || '\uD83D\uDD01', dueDay: dueDay };
    return fillCycle(s, dueDay, rem.paid_for || null, null);
  }

  function rowHtml(s) {
    var name = Mock.escapeHtml(s.name);
    var attrs = ' data-type="' + s.type + '" data-key="' + Mock.escapeHtml(s.key) + '"';

    if (editMode) {
      var detail = s.dueDay ? 'day ' + s.dueDay + ' of each month'
                            : (s.type === 'card' ? 'no due day set' : '');
      var hint = s.type === 'card' ? 'clear due day' : 'remove';
      return cardHtml('', s.emoji, name, '<div class="cd-sub">' + detail + '</div>',
        (s.type === 'card' && !s.dueDay)
          ? '<span class="cd-setlink" data-action="edit"' + attrs + '>Set due day \u203A</span>'
          : '<button class="cd-remove" data-action="remove"' + attrs + ' aria-label="' + hint + '">\u2715</button>');
    }

    if (s.kind === 'set') {
      return cardHtml('', s.emoji, name, '<div class="cd-sub">no due day set</div>',
        '<span class="cd-setlink" data-action="edit"' + attrs + '>Set due day \u203A</span>');
    }
    if (s.kind === 'paid') {
      return cardHtml('cd-done', s.emoji, name,
        '<div class="cd-sub">next due ' + fmtDue(s.dueTarget) + '</div>',
        '<span class="cd-status" data-action="undo"' + attrs + ' title="tap to undo">\u2713 paid</span>');
    }
    var amt = (s.amount != null) ? '<span class="cd-amt">' + Mock.fmtBaht(s.amount) + '</span> \u00B7 ' : '';
    var sub = '<div class="cd-sub">' + amt + 'due ' + fmtDue(s.dueTarget) +
      ' <button class="cd-edit" data-action="edit"' + attrs + ' aria-label="edit">\u270E</button></div>';
    var count = s.days < 0 ? 'overdue by ' + (-s.days) + ' day' + (s.days === -1 ? '' : 's')
      : s.days === 0 ? 'due today'
      : s.days === 1 ? 'due tomorrow'
      : 'in ' + s.days + ' days';
    var right = '<span class="cd-count">' + count + '</span>' +
      (s.days <= ACT ? '<button class="cd-paid-btn" data-action="paid"' + attrs + '>Mark paid</button>' : '');
    var cls = s.kind === 'overdue' ? 'cd-overdue' : s.kind === 'promoted' ? 'cd-promoted' : 'cd-calm';
    return cardHtml(cls, s.emoji, name, sub, right);
  }
  function cardHtml(cls, emoji, name, main, right) {
    return '<div class="cd-card ' + cls + '"><span class="cd-emoji">' + emoji + '</span>' +
      '<div class="cd-main"><div class="cd-name">' + name + '</div>' + main + '</div>' +
      '<div class="cd-right">' + right + '</div></div>';
  }

  function hide() { titleEl.style.display = 'none'; listEl.style.display = 'none'; }
  function render() {
    if (!cardsCache.length && !remsCache.length) { hide(); return; }
    var states = cardsCache.map(cardState).concat(remsCache.map(remState))
      .sort(function (a, b) { return a.sortKey - b.sortKey; });
    stateByKey = {};
    states.forEach(function (s) { stateByKey[s.type + ':' + s.key] = s; });
    titleEl.style.display = ''; listEl.style.display = '';
    editBtn.textContent = editMode ? 'Done' : 'Edit';
    var html = states.map(rowHtml).join('');
    if (editMode) {
      html += '<button class="cd-add-row" data-action="add">\uFF0B Add reminder (subscription or utility)\u2026</button>';
    }
    listEl.innerHTML = html;
  }

  // ---- mutations (optimistic, revert on failure) ----
  function fail(err, revert) {
    revert();
    render();
    alert("Couldn't save that just now: " + (err && err.message ? err.message : err));
  }
  function persistCycle(l4, patch, prevCycle) {
    DataSource.saveCardCycle(l4, patch).catch(function (err) {
      fail(err, function () {
        if (prevCycle === undefined) delete cyclesCache[l4]; else cyclesCache[l4] = prevCycle;
      });
    });
  }
  function persistRem(patch, prevRems) {
    return DataSource.saveUtility(patch).then(function (items) {
      remsCache = items; render();
    }).catch(function (err) { fail(err, function () { remsCache = prevRems; }); });
  }

  function markPaid(type, key) {
    var s = stateByKey[type + ':' + key]; if (!s || !s.dueTarget) return;
    var iso = isoOf(midnight(s.dueTarget));
    if (type === 'card') {
      var prev = cyclesCache[key] ? Object.assign({}, cyclesCache[key]) : undefined;
      cyclesCache[key] = Object.assign({}, cyclesCache[key], { paid_for: iso }); render();
      persistCycle(key, { paid_for: iso }, prev);
    } else {
      var prevRems = remsCache;
      remsCache = remsCache.map(function (u) {
        return String(u.id) === key ? Object.assign({}, u, { paid_for: iso }) : u;
      });
      render();
      persistRem({ id: key, paid_for: iso }, prevRems);
    }
  }
  function undoPaid(type, key) {
    if (type === 'card') {
      var prev = cyclesCache[key] ? Object.assign({}, cyclesCache[key]) : undefined;
      var nc = Object.assign({}, cyclesCache[key]); delete nc.paid_for; cyclesCache[key] = nc; render();
      persistCycle(key, { paid_for: null }, prev);
    } else {
      var prevRems = remsCache;
      remsCache = remsCache.map(function (u) {
        if (String(u.id) !== key) return u;
        var nu = Object.assign({}, u); delete nu.paid_for; return nu;
      });
      render();
      persistRem({ id: key, paid_for: null }, prevRems);
    }
  }
  function removeItem(type, key) {
    if (type === 'card') {
      // Clearing stops tracking only — the card stays in cards.json (OCR safe).
      var prev = cyclesCache[key] ? Object.assign({}, cyclesCache[key]) : undefined;
      delete cyclesCache[key]; render();
      persistCycle(key, { due_day: null, paid_for: null }, prev);
    } else {
      var prevRems = remsCache;
      remsCache = remsCache.filter(function (u) { return String(u.id) !== key; });
      render();
      DataSource.deleteUtility(key).then(function (items) {
        remsCache = items; render();
      }).catch(function (err) { fail(err, function () { remsCache = prevRems; }); });
    }
  }

  editBtn.addEventListener('click', function () { editMode = !editMode; render(); });
  listEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]'); if (!t) return;
    var act = t.getAttribute('data-action');
    if (act === 'add') { openSheet('rem', null); return; }
    var type = t.getAttribute('data-type'), key = t.getAttribute('data-key');
    if (act === 'paid') markPaid(type, key);
    else if (act === 'undo') undoPaid(type, key);
    else if (act === 'remove') removeItem(type, key);
    else openSheet(type, key);      // 'edit'
  });

  // ---- bottom sheet: card day-picker / reminder name+day ----
  var sheetBack = document.getElementById('cd-sheet-back');
  var grid = document.getElementById('cd-day-grid');
  var nameInput = document.getElementById('cd-sheet-name');
  var emojiRow = document.getElementById('cd-sheet-emoji-row');
  var emojiInput = document.getElementById('cd-sheet-emoji');
  var editing = null;               // {type, key} — key null = new reminder
  var pendingDay = null;

  // Preset chips fill the free-type box; the box also takes any emoji from the
  // keyboard. Saved value = first grapheme (fallback: trimmed string).
  var EMOJI_PRESETS = ['🔁', '💡', '💧', '📶', '🎬', '🎵', '🏋️', '📰'];
  EMOJI_PRESETS.forEach(function (em) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'emoji-chip'; b.textContent = em;
    b.addEventListener('click', function () { emojiInput.value = em; markChip(); });
    emojiRow.insertBefore(b, emojiInput);
  });
  function markChip() {
    var cur = emojiInput.value.trim();
    Array.prototype.forEach.call(emojiRow.querySelectorAll('.emoji-chip'), function (c) {
      c.classList.toggle('sel', c.textContent === cur);
    });
  }
  emojiInput.addEventListener('input', markChip);
  function firstEmoji(str) {
    str = String(str || '').trim();
    if (!str) return '';
    if (window.Intl && Intl.Segmenter) {
      var it = new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(str)[Symbol.iterator]().next();
      return it.done ? '' : it.value.segment;
    }
    return str;
  }

  function openSheet(type, key) {
    editing = { type: type, key: key };
    var title, hint;
    if (type === 'card') {
      var cy = cyclesCache[key] || {};
      pendingDay = (cy.due_day != null && cy.due_day !== '') ? Number(cy.due_day) : null;
      var card = cardsCache.filter(function (c) { return c.last4 === key; })[0];
      title = 'When is ' + ((card && card.name) || ('*' + key)) + ' due?';
      hint = 'Pick the day of the month the payment is due.';
      nameInput.style.display = 'none';
      emojiRow.style.display = 'none';
    } else {
      var rem = key ? remsCache.filter(function (u) { return String(u.id) === key; })[0] : null;
      pendingDay = (rem && rem.due_day) ? Number(rem.due_day) : null;
      nameInput.value = (rem && rem.name) || '';
      emojiInput.value = (rem && rem.emoji) || '';
      markChip();
      title = rem ? 'Edit ' + rem.name : 'New reminder';
      hint = 'What is it, and which day of the month is it due?';
      nameInput.style.display = '';
      emojiRow.style.display = '';
    }
    document.getElementById('cd-sheet-title').textContent = title;
    document.getElementById('cd-sheet-hint').textContent = hint;
    grid.innerHTML = '';
    for (var d = 1; d <= 28; d++) {
      var cell = document.createElement('div');
      cell.className = 'day-cell'; cell.textContent = d; cell.setAttribute('data-day', d);
      grid.appendChild(cell);
    }
    refreshSheet();
    sheetBack.classList.add('open');
    if (type === 'rem' && !key) nameInput.focus();
  }
  function refreshSheet() {
    Array.prototype.forEach.call(grid.querySelectorAll('.day-cell'), function (cell) {
      cell.classList.toggle('sel', Number(cell.getAttribute('data-day')) === pendingDay);
    });
    var pv = document.getElementById('cd-sheet-preview');
    if (pendingDay) {
      var due = firstOnOrAfter(pendingDay, TODAY);
      var days = Math.round((midnight(due) - TODAY) / DAY);
      pv.textContent = 'Next due ' + fmtDue(due) + ' \u2014 ' + (days <= SOON ? '\u26A0 ' : '') +
        (days === 0 ? 'due today' : 'in ' + days + ' day' + (days === 1 ? '' : 's')) + '.';
    } else { pv.textContent = 'Pick a day.'; }
  }
  function closeSheet() { sheetBack.classList.remove('open'); }
  grid.addEventListener('click', function (e) {
    var cell = e.target.closest('.day-cell'); if (!cell) return;
    pendingDay = Number(cell.getAttribute('data-day')); refreshSheet();
  });
  document.getElementById('cd-sheet-cancel').addEventListener('click', closeSheet);
  sheetBack.addEventListener('click', function (e) { if (e.target === sheetBack) closeSheet(); });
  document.getElementById('cd-sheet-save').addEventListener('click', function () {
    if (!editing || !pendingDay) { closeSheet(); return; }
    if (editing.type === 'card') {
      var l4 = editing.key, day = pendingDay;
      var prev = cyclesCache[l4] ? Object.assign({}, cyclesCache[l4]) : undefined;
      var nc = Object.assign({}, cyclesCache[l4]); nc.due_day = day; delete nc.paid_for;
      cyclesCache[l4] = nc;
      closeSheet(); render();
      persistCycle(l4, { due_day: day, paid_for: null }, prev);
    } else {
      var nm = nameInput.value.trim();
      if (!nm) { nameInput.focus(); return; }
      var patch = { name: nm, due_day: pendingDay, paid_for: null,
                    emoji: firstEmoji(emojiInput.value) || null };
      if (editing.key) patch.id = editing.key;
      closeSheet();
      persistRem(patch, remsCache);
    }
  });

  // ---- load ----
  (async function () {
    try {
      var cardsP = DataSource.loadCards().catch(function () { return []; });
      var cyclesP = DataSource.loadCardCycles().catch(function () { return {}; });
      var remsP = DataSource.loadUtilities().catch(function () { return []; });
      var verP = DataSource.loadVerification().catch(function () { return { cards: [] }; });
      cardsCache = (await cardsP) || [];
      cyclesCache = (await cyclesP) || {};
      remsCache = (await remsP) || [];
      var ver = await verP;
      var vcards = (ver && ver.cards) || [];
      stmtByCard = {};
      vcards.forEach(function (c) {
        if (c && c.card_last4) stmtByCard[c.card_last4] = { due_date: c.due_date, statement_total: c.statement_total };
      });
      render();
    } catch (e) { hide(); }
  })();
})();
</script>
</body>
</html>
