<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  :root {
    --bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;
    --text:#1a1917;--text-muted:#6b6860;--text-faint:#a8a59e;
    --green:#1a6b3c;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:480px;margin:0 auto;padding:40px 20px;}
  h1{font-size:24px;margin-bottom:4px;font-weight:500;}
  .sub{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-bottom:28px;}
  a.tile{display:flex;justify-content:space-between;align-items:center;
         padding:18px 18px;margin:10px 0;background:var(--surface);
         border:1px solid var(--border);border-radius:12px;
         text-decoration:none;color:var(--text);font-weight:500;}
  a.tile:active{background:var(--bg);}
  a.tile.primary{background:var(--green);color:#fff;border-color:var(--green);}
  a.tile.primary .arrow{color:rgba(255,255,255,0.7);}
  .tile-right{display:flex;align-items:center;gap:9px;}
  .badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;
         background:#fff;color:var(--green);font-family:var(--mono);font-size:12px;
         font-weight:500;display:none;align-items:center;justify-content:center;}
  .arrow{color:var(--text-faint);font-family:var(--mono);}
  .meta{margin-top:24px;font-size:11px;color:var(--text-faint);
        font-family:var(--mono);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Budget</h1>
  <div class="sub">phone · github mode</div>
  <a class="tile primary" href="review.html">
    <span>📥 Review slips</span>
    <span class="tile-right"><span class="badge" id="review-badge">0</span><span class="arrow">›</span></span>
  </a>
  <a class="tile" href="entry_form.html"><span>+ Add entry</span><span class="arrow">›</span></a>
  <a class="tile" href="monthly_report.html"><span>Monthly report</span><span class="arrow">›</span></a>
  <a class="tile" href="edit_log.html"><span>Edit log</span><span class="arrow">›</span></a>
  <a class="tile" href="roong_settlement.html"><span>Roong Settlement</span><span class="arrow">›</span></a>
  <a class="tile" href="statement_verify.html"><span>Verify statements</span><span class="arrow">›</span></a>
  <div class="meta">
    Data lives in your private budget-data repo on GitHub.<br>
    Slip OCR runs automatically (hourly) via GitHub Actions; review them here.
  </div>
</div>
<script src="data-source.js"></script>
<script>
  // Show a pending-drafts badge on the Review tile. Best-effort — if the count
  // can't be fetched, the tile still works; the badge just stays hidden.
  (async function () {
    try {
      var drafts = await DataSource.loadDrafts();
      var n = (drafts || []).length;
      if (n > 0) {
        var b = document.getElementById('review-badge');
        b.textContent = n;
        b.style.display = 'inline-flex';
      }
    } catch (e) { /* leave badge hidden */ }
  })();
</script>
</body>
</html>
