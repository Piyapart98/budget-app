<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Report — new design</title>
<link rel="stylesheet" href="mock.css">
<style>
  .month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .month-nav button{background:none;border:none;font-size:20px;color:var(--text-faint);
                    cursor:pointer;padding:4px 10px;}
  .story{font-size:14px;color:var(--text-soft);line-height:1.55;margin:6px 0 14px;}
  .story b{color:var(--text);}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .tile{background:#f1efe8;border-radius:12px;padding:10px;}
  .tile .t-label{font-size:10px;color:var(--text-faint);}
  .tile .t-val{font-size:16px;font-weight:700;}
  .tile .t-val.green{color:var(--green);}

  /* Part 1 — share-of-total bar + aligned legend */
  .sharebar{display:flex;width:100%;height:42px;border-radius:8px;overflow:hidden;margin:2px 0 14px;}
  .sharebar>div{height:100%;}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;font-size:13px;}
  .legend .item{display:flex;align-items:center;gap:7px;min-width:0;}
  .legend .sw{width:12px;height:12px;border-radius:3px;flex:none;}
  .legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend .pc{font-variant-numeric:tabular-nums;color:var(--text-soft);font-weight:600;}

  /* Part 2 — smooth trend (spent + income, y-axis, gridlines) */
  .trend{position:relative;width:100%;height:172px;}
  .trend svg{display:block;}
  .trend-x{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);
           margin-top:6px;}
  .trend-legend{display:flex;gap:18px;margin-top:12px;font-size:13px;}
  .trend-legend .item{display:flex;align-items:center;gap:7px;}
  .trend-legend .sw{width:12px;height:12px;border-radius:3px;}

  /* Part 3 — 12-month heatmap */
  .hm-wrap{display:flex;gap:8px;}
  .hm-days{display:flex;flex-direction:column;justify-content:space-between;
           font-size:9px;color:var(--text-faint);padding:16px 0 2px;flex:none;}
  .hm-scroll{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .hm-grid{display:inline-block;}
  .hm-months{display:flex;font-size:10px;color:var(--text-faint);margin-bottom:4px;}
  .hm-cols{display:flex;}
  .hm-col{display:flex;flex-direction:column;}
  .hm-cell{width:11px;height:11px;margin:1.5px;border-radius:2px;background:#efe9dd;}
  .hm-cell.empty{background:transparent;}
  .hm-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;
             font-size:10px;color:var(--text-faint);margin-top:10px;}
  .hm-legend .sw{width:11px;height:11px;border-radius:2px;}
  .hm-stat{font-size:12px;color:var(--text-soft);margin-top:8px;}
  .hm-stat b{color:var(--text);font-weight:600;}

  /* Part 4 — where it went (expandable + Roong status) */
  .cat-row{margin-bottom:9px;background:var(--surface);border:1px solid var(--border);
           border-radius:12px;padding:11px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .cat-row:active{background:#faf8f2;}
  .cat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .cat-name{font-size:14px;display:flex;align-items:center;gap:8px;min-width:0;}
  .cat-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-right{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-soft);
             display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .cat-right .pct{color:var(--text-faint);font-size:11px;}
  .chev{font-size:10px;color:var(--text-faint);transition:transform .15s;display:inline-block;}
  .cat-row.open .chev{transform:rotate(90deg);}
  .cat-track{height:6px;background:#f1efe8;border-radius:4px;margin-top:8px;overflow:hidden;}
  .cat-fill{height:100%;border-radius:4px;}
  .entries{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);display:none;}
  .cat-row.open .entries{display:block;}
  .entry{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;
         font-size:12px;padding:5px 0;}
  .entry .ed{color:var(--text-faint);font-size:11px;}
  .entry .en{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .ea{font-variant-numeric:tabular-nums;color:var(--text-soft);text-align:right;}
  .entry.empty{grid-column:1/-1;text-align:center;color:var(--text-faint);}
  .settle-tag{font-size:9px;padding:1px 6px;border-radius:999px;margin-left:6px;
              vertical-align:middle;white-space:nowrap;font-weight:600;}
  .settle-tag.settled{background:#e3f3e9;color:#1f7a44;}
  .settle-tag.pending{background:#fdf3e0;color:#a9700f;}
  .settle-tag.unsettled{background:#fdeaea;color:#b3373c;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">‹ Home</a>
  <div class="month-nav">
    <button id="prev">‹</button><h1 id="month-label">…</h1><button id="next">›</button>
  </div>
  <div class="story" id="story">Loading…</div>
  <div class="tiles">
    <div class="tile"><div class="t-label">Spent</div><div class="t-val" id="t-spent">—</div></div>
    <div class="tile"><div class="t-label">Income</div><div class="t-val green" id="t-income">—</div></div>
    <div class="tile"><div class="t-label">Saved</div><div class="t-val green" id="t-saved">—</div></div>
  </div>

  <div class="section-title">What you spent on</div>
  <div class="card" id="share-card"><div class="soft-note">Loading…</div></div>

  <div class="section-title">Month-over-month</div>
  <div class="card">
    <div class="trend" id="trend"></div>
    <div class="trend-x" id="trend-x"></div>
    <div class="trend-legend">
      <span class="item"><span class="sw" style="background:#EF9F27"></span>Spent</span>
      <span class="item"><span class="sw" style="background:#1a6b3c"></span>Income</span>
    </div>
  </div>

  <div class="section-title">Spending heatmap · last 12 months</div>
  <div class="card">
    <div class="hm-wrap">
      <div class="hm-days"><span>Mon</span><span>Wed</span><span>Fri</span><span>Sun</span></div>
      <div class="hm-scroll"><div class="hm-grid">
        <div class="hm-months" id="hm-months"></div>
        <div class="hm-cols" id="hm-cols"></div>
      </div></div>
    </div>
    <div class="hm-legend">Less
      <span class="sw" style="background:#efe9dd"></span>
      <span class="sw" style="background:#f7dca6"></span>
      <span class="sw" style="background:#f0b95e"></span>
      <span class="sw" style="background:#e89a2c"></span>
      <span class="sw" style="background:#c9760f"></span>More</div>
    <div class="hm-stat" id="hm-stat"></div>
  </div>

  <div class="section-title">Where it went</div>
  <div id="cats"><div class="soft-note">Loading…</div></div>
</div>

<script src="../data-source.js"></script>
<script src="mock-shared.js"></script>
<script>
(function () {
  'use strict';

  // Biggest category is amber (the story); everything else is gray context,
  // following the house BBC-style palette (highlight one, gray the rest).
  var AMBER = '#EF9F27';
  var GRAYS = ['#8f897a','#9c9687','#a9a394','#b6b0a1','#c3bdae','#D3D1C7'];
  var HM_SHADES = ['#efe9dd','#f7dca6','#f0b95e','#e89a2c','#c9760f'];
  var ROONG = 'With Roong';

  var rows = null, isIncome = null;
  var settledSet = {}, pendingSet = {};   // settlement_id -> true
  var cur = new Date(); cur.setDate(1);

  function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function label(d) { return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); }
  function shiftMonth(d, n) { var x = new Date(d); x.setMonth(x.getMonth() + n); return x; }

  function totalsFor(mk) {
    var spent = 0, income = 0, byCat = {};
    rows.forEach(function (r) {
      if (Mock.isDeleted(r) || Mock.monthKey(r.Date) !== mk) return;
      var amt = parseFloat(r.Amount) || 0;
      if (isIncome(r.Category)) income += amt;
      else { spent += amt; var c = (r.Category || 'Other').trim() || 'Other';
             byCat[c] = (byCat[c] || 0) + amt; }
    });
    return { spent: spent, income: income, byCat: byCat };
  }

  // ---- Part 4 helper: settlement status tag for a "With Roong" row ----
  function roongTag(r) {
    var sid = String(r.settlement_id || '').trim();
    if (sid && settledSet[sid]) return { cls: 'settled', text: '✓ Settled' };
    if (sid && pendingSet[sid]) return { cls: 'pending', text: 'Pending' };
    return { cls: 'unsettled', text: 'Unsettled' };
  }

  function render() {
    var mk = key(cur);
    document.getElementById('month-label').textContent = label(cur);
    var t = totalsFor(mk);
    var prev = totalsFor(key(shiftMonth(cur, -1)));
    var ranked = Object.keys(t.byCat).map(function (c) { return [c, t.byCat[c]]; })
      .sort(function (a, b) { return b[1] - a[1]; });

    // ---- Story sentence (kept) ----
    var story;
    if (t.spent === 0) {
      story = 'Nothing recorded for ' + label(cur) + ' yet.';
    } else {
      story = "You've spent <b>" + Mock.fmtBaht(t.spent) + '</b>';
      if (prev.spent > 0) {
        var diff = t.spent - prev.spent;
        if (Math.round(diff) === 0) story += ' — <b>about the same</b> as last month';
        else story += ' — about <b>' + Mock.fmtBaht(Math.abs(diff)) + ' ' +
                      (diff < 0 ? 'less' : 'more') + '</b> than last month';
      }
      if (ranked.length) story += '. ' + Mock.catEmoji(ranked[0][0]) + ' <b>' +
        Mock.escapeHtml(ranked[0][0]) + '</b> was your biggest category.';
      else story += '.';
    }
    document.getElementById('story').innerHTML = story;

    // ---- Tiles ----
    document.getElementById('t-spent').textContent = Mock.fmtBaht(t.spent);
    document.getElementById('t-income').textContent = Mock.fmtBaht(t.income);
    document.getElementById('t-saved').textContent =
      t.income > 0 ? Math.max(0, Math.round((t.income - t.spent) / t.income * 100)) + '%' : '—';

    renderShare(t, ranked);
    renderTrend();
    renderHeatmap();
    renderWhereItWent(t, ranked);
  }

  // ---- Part 1: share-of-total bar + aligned legend ----
  function renderShare(t, ranked) {
    var card = document.getElementById('share-card');
    if (t.spent <= 0) { Mock.softFail(card, 'No spending to break down this month.'); return; }

    // Top 5 categories, the rest folded into "Other".
    var top = ranked.slice(0, 5);
    var restTotal = ranked.slice(5).reduce(function (s, e) { return s + e[1]; }, 0);
    var items = top.map(function (e, i) {
      return { name: e[0], val: e[1], color: i === 0 ? AMBER : GRAYS[i] };
    });
    if (restTotal > 0) items.push({ name: 'Other', val: restTotal, color: GRAYS[5] });

    var bar = items.map(function (it) {
      return '<div style="width:' + (it.val / t.spent * 100) + '%;background:' + it.color + '"></div>';
    }).join('');
    var legend = items.map(function (it) {
      var pct = Math.round(it.val / t.spent * 100);
      return '<span class="item"><span class="sw" style="background:' + it.color + '"></span>' +
        '<span class="nm">' + Mock.catEmoji(it.name) + ' ' + Mock.escapeHtml(it.name) + '</span>' +
        '<span class="pc">' + pct + '%</span></span>';
    }).join('');
    card.innerHTML = '<div class="sharebar">' + bar + '</div><div class="legend">' + legend + '</div>';
  }

  // ---- Part 2: smooth month-over-month trend — spent + income, axis, grid ----
  function renderTrend() {
    var box = document.getElementById('trend');
    var xrow = document.getElementById('trend-x');
    var N = 6, months = [], spent = [], income = [];
    for (var i = N - 1; i >= 0; i--) {
      var d = shiftMonth(cur, -i), tt = totalsFor(key(d));
      months.push(d); spent.push(tt.spent); income.push(tt.income);
    }

    var W = box.clientWidth || 320, H = 172;
    var gutter = 40, padTop = 12, padBot = 16, padR = 8;
    var xA = gutter, xB = W - padR, yA = padTop, yB = H - padBot;

    var maxV = Math.max.apply(null, spent.concat(income)) || 1;
    var stepGuess = maxV / 3;
    var mag = Math.pow(10, Math.floor(Math.log(stepGuess) / Math.LN10));
    var stepN = mag * (stepGuess / mag <= 1 ? 1 : stepGuess / mag <= 2 ? 2 : stepGuess / mag <= 5 ? 5 : 10);
    var top = Math.max(stepN, Math.ceil(maxV / stepN) * stepN);
    var ticks = []; for (var v = 0; v <= top + 0.5; v += stepN) ticks.push(v);

    function X(i) { return xA + (xB - xA) * i / (N - 1); }
    function Y(val) { return yB - (yB - yA) * val / top; }
    function fmtK(val) {
      if (val === 0) return '฿0';
      return val >= 1000 ? '฿' + (Math.round(val / 100) / 10) + 'k' : '฿' + Math.round(val);
    }

    // Catmull-Rom -> cubic bezier for a smooth curve through the points.
    function smoothPath(p) {
      if (p.length < 2) return p.length ? 'M' + p[0].x + ',' + p[0].y : '';
      var d = 'M' + p[0].x + ',' + p[0].y;
      for (var i = 0; i < p.length - 1; i++) {
        var p0 = p[i === 0 ? 0 : i - 1], p1 = p[i], p2 = p[i + 1],
            p3 = p[i + 2 < p.length ? i + 2 : i + 1];
        d += 'C' + (p1.x + (p2.x - p0.x) / 6) + ',' + (p1.y + (p2.y - p0.y) / 6) + ' ' +
                   (p2.x - (p3.x - p1.x) / 6) + ',' + (p2.y - (p3.y - p1.y) / 6) + ' ' +
                   p2.x + ',' + p2.y;
      }
      return d;
    }
    var sp = spent.map(function (val, i) { return { x: X(i), y: Y(val) }; });
    var ip = income.map(function (val, i) { return { x: X(i), y: Y(val) }; });
    var spPath = smoothPath(sp), ipPath = smoothPath(ip);
    var spArea = spPath + 'L' + sp[N - 1].x + ',' + yB + 'L' + sp[0].x + ',' + yB + 'Z';

    var grid = ticks.map(function (val) {
      var y = Y(val);
      return '<line x1="' + xA + '" y1="' + y + '" x2="' + xB + '" y2="' + y +
        '" stroke="rgba(128,128,128,0.14)" stroke-width="1"/>' +
        '<text x="' + (xA - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" ' +
        'fill="#a09a8c">' + fmtK(val) + '</text>';
    }).join('');

    box.innerHTML =
      '<svg width="' + W + '" height="' + H + '">' +
      '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + AMBER + '" stop-opacity="0.18"/>' +
      '<stop offset="1" stop-color="' + AMBER + '" stop-opacity="0"/></linearGradient></defs>' +
      grid +
      '<path d="' + spArea + '" fill="url(#tg)"/>' +
      '<path d="' + ipPath + '" fill="none" stroke="#1a6b3c" stroke-width="2.5" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + spPath + '" fill="none" stroke="' + AMBER + '" stroke-width="2.5" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + sp[N - 1].x + '" cy="' + sp[N - 1].y + '" r="4.5" fill="' + AMBER + '"/>' +
      '<circle cx="' + ip[N - 1].x + '" cy="' + ip[N - 1].y + '" r="4.5" fill="#1a6b3c"/>' +
      '</svg>';

    xrow.style.paddingLeft = gutter + 'px';
    xrow.innerHTML = months.map(function (d) {
      return '<span>' + d.toLocaleDateString('en-GB', { month: 'short' }) + '</span>';
    }).join('');
  }

  // ---- Part 3: 12-month rolling daily heatmap ----
  function renderHeatmap() {
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    // Window ends at the selected month's last day, capped at today.
    var endOfMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var end = endOfMonth < today ? endOfMonth : today;
    var start = new Date(end); start.setDate(end.getDate() - 364);

    // Daily spend (spending rows only) keyed by YYYY-MM-DD.
    function dkey(d) { return d.toISOString().slice(0, 10); }
    var daily = {};
    rows.forEach(function (r) {
      if (Mock.isDeleted(r) || isIncome(r.Category)) return;
      var ds = String(r.Date || '').slice(0, 10);
      daily[ds] = (daily[ds] || 0) + (parseFloat(r.Amount) || 0);
    });

    // Percentile thresholds over non-zero days, so colors are meaningful.
    var vals = [], zeroDays = 0, busiest = { v: -1, ds: null };
    for (var dd = new Date(start); dd <= end; dd.setDate(dd.getDate() + 1)) {
      var v = daily[dkey(dd)] || 0;
      if (v > 0) vals.push(v); else zeroDays++;
      if (v > busiest.v) busiest = { v: v, ds: dkey(dd) };
    }
    vals.sort(function (a, b) { return a - b; });
    function pct(p) { return vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0; }
    var b1 = pct(0.25), b2 = pct(0.5), b3 = pct(0.75);
    function shade(v) {
      if (v <= 0) return HM_SHADES[0];
      if (v <= b1) return HM_SHADES[1];
      if (v <= b2) return HM_SHADES[2];
      if (v <= b3) return HM_SHADES[3];
      return HM_SHADES[4];
    }

    // Build cells, padded so each column is a Mon..Sun week.
    var lead = (start.getDay() + 6) % 7;
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push(null);
    for (var d2 = new Date(start); d2 <= end; d2.setDate(d2.getDate() + 1)) {
      cells.push({ v: daily[dkey(d2)] || 0, d: new Date(d2) });
    }
    while (cells.length % 7 !== 0) cells.push(null);
    var weeks = cells.length / 7;

    var colsHtml = '', monthsHtml = '', lastMonth = -1, colPx = 14; // 11px cell + 1.5*2 margin
    for (var w = 0; w < weeks; w++) {
      colsHtml += '<div class="hm-col">';
      var firstReal = null;
      for (var r2 = 0; r2 < 7; r2++) {
        var c = cells[w * 7 + r2];
        if (c && !firstReal) firstReal = c.d;
        if (!c) { colsHtml += '<div class="hm-cell empty"></div>'; continue; }
        var lab = c.d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
                  ' · ' + Mock.fmtBaht(c.v);
        colsHtml += '<div class="hm-cell" title="' + lab + '" style="background:' + shade(c.v) + '"></div>';
      }
      colsHtml += '</div>';
      var lbl = '';
      if (firstReal && firstReal.getMonth() !== lastMonth) { lbl = MON[firstReal.getMonth()]; lastMonth = firstReal.getMonth(); }
      monthsHtml += '<span style="width:' + colPx + 'px;flex:none">' + lbl + '</span>';
    }
    document.getElementById('hm-cols').innerHTML = colsHtml;
    document.getElementById('hm-months').innerHTML = monthsHtml;

    var stat = document.getElementById('hm-stat');
    if (busiest.v > 0) {
      var bd = new Date(busiest.ds).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      stat.innerHTML = 'Busiest day: <b>' + bd + ' · ' + Mock.fmtBaht(busiest.v) + '</b> · ' +
                       zeroDays + ' no-spend days';
    } else { stat.textContent = 'No spending in this window.'; }
  }

  // ---- Part 4: expandable "where it went" with Roong status ----
  function renderWhereItWent(t, ranked) {
    var wrap = document.getElementById('cats');
    if (!ranked.length) { Mock.softFail(wrap, 'No spending this month.'); return; }
    var mk = key(cur);
    wrap.innerHTML = '';
    ranked.forEach(function (e, idx) {
      var cat = e[0], amt = e[1], pct = Math.round(amt / t.spent * 100);
      var widthPct = Math.round(amt / ranked[0][1] * 100);
      var fillColor = idx === 0 ? AMBER : '#c3bdae';

      // Entries for this category in the selected month, chronological.
      var entries = rows.filter(function (r) {
        return !Mock.isDeleted(r) && Mock.monthKey(r.Date) === mk && (r.Category || '').trim() === cat;
      }).sort(function (a, b) { return String(a.Date) < String(b.Date) ? -1 : 1; });

      var entriesHtml = entries.length ? entries.map(function (r) {
        var d = new Date(r.Date);
        var ds = isNaN(d) ? Mock.escapeHtml(r.Date || '') :
          d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        var desc = (r.Description || r.Note || '').trim() || '(no description)';
        var tag = '';
        if (cat === ROONG) { var tg = roongTag(r);
          tag = ' <span class="settle-tag ' + tg.cls + '">' + tg.text + '</span>'; }
        return '<div class="entry"><span class="ed">' + ds + '</span>' +
          '<span class="en">' + Mock.escapeHtml(desc) + tag + '</span>' +
          '<span class="ea">' + Mock.fmtBaht(r.Amount) + '</span></div>';
      }).join('') : '<div class="entry empty">No entries</div>';

      var row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML =
        '<div class="cat-head"><span class="cat-name">' + Mock.catEmoji(cat) +
        ' <span class="nm">' + Mock.escapeHtml(cat) + '</span></span>' +
        '<span class="cat-right">' + Mock.fmtBaht(amt) +
        ' <span class="pct">' + pct + '%</span> <span class="chev">▶</span></span></div>' +
        '<div class="cat-track"><div class="cat-fill" style="width:' + widthPct +
        '%;background:' + fillColor + '"></div></div>' +
        '<div class="entries">' + entriesHtml + '</div>';
      row.addEventListener('click', function () { row.classList.toggle('open'); });
      wrap.appendChild(row);
    });
  }

  document.getElementById('prev').addEventListener('click', function () {
    if (rows) { cur = shiftMonth(cur, -1); render(); }
  });
  document.getElementById('next').addEventListener('click', function () {
    if (rows) { cur = shiftMonth(cur, 1); render(); }
  });

  (async function () {
    try {
      var cfgP = DataSource.loadConfig().catch(function () { return null; });
      // Roong settlement status — read-only, best-effort. Empty sets => rows
      // fall back to "Unsettled", matching the live page's behavior.
      var roongP = Promise.all([
        DataSource.loadRoongPending().catch(function () { return []; }),
        DataSource.loadRoongHistory().catch(function () { return []; }),
      ]).then(function (res) {
        (res[0] || []).forEach(function (s) { pendingSet[s.settlement_id] = true; });
        (res[1] || []).forEach(function (s) { settledSet[s.settlement_id] = true; });
      }).catch(function () {});

      rows = await DataSource.loadDatabase();
      isIncome = Mock.incomeTester(await cfgP);
      await roongP;
      render();
    } catch (e) {
      document.getElementById('story').textContent =
        "Couldn't load the report right now. Check your connection and reload.";
      Mock.softFail(document.getElementById('share-card'), "Couldn't load data.");
      Mock.softFail(document.getElementById('cats'), "Couldn't load categories.");
    }
  })();
})();
</script>
</body>
</html>
