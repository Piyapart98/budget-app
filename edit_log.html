<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Log — Budget Pipeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
  :root{
    --bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;--border-strong:#c8c5b8;
    --text:#1a1917;--text-muted:#6b6860;--text-faint:#a8a59e;
    --green:#1a6b3c;--green-bg:#edf7f1;--green-border:#86c9a3;
    --red:#b83232;--red-bg:#fef2f2;--red-border:#f0a0a0;
    --amber:#a05c00;--amber-bg:#fff8ed;
    --blue:#1a4a8a;--blue-bg:#edf2fb;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 0;}
  .header-title{font-size:18px;font-weight:500;}
  .header-sub{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;margin-bottom:12px;}
  .tabs{display:flex;border-top:1px solid var(--border);margin:0 -16px;}
  .tab{flex:1;padding:10px;font-size:13px;font-weight:500;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;font-family:var(--sans);}
  .tab.active{color:var(--text);border-bottom-color:var(--text);}
  .view{display:none;padding:12px 16px;}
  .view.active{display:block;}
  .tx-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;}
  .tx-card.deleted-card{opacity:0.45;}
  .tx-header{padding:10px 12px;border-bottom:1px solid var(--border);}
  .tx-desc{font-size:14px;font-weight:500;}
  .tx-meta{font-size:10px;color:var(--text-faint);font-family:var(--mono);margin-top:3px;}
  .tx-amount{font-size:14px;font-weight:500;font-family:var(--mono);}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .badge{font-size:10px;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-weight:500;}
  .badge-edited{background:var(--blue-bg);color:var(--blue);}
  .badge-deleted{background:var(--red-bg);color:var(--red);}
  .badge-manual{background:var(--amber-bg);color:var(--amber);}
  .tx-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--border);}
  .tx-btn{padding:9px;font-size:12px;font-weight:500;font-family:var(--sans);border:none;background:transparent;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:4px;}
  .tx-btn:first-child{border-right:1px solid var(--border);}
  .btn-edit{color:var(--blue);} .btn-edit:hover{background:var(--blue-bg);}
  .btn-delete{color:var(--red);} .btn-delete:hover{background:var(--red-bg);}
  .deleted-note{padding:8px 12px;font-size:11px;color:var(--text-faint);font-family:var(--mono);}
  .cl-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .cl-row:last-child{border-bottom:none;}
  .cl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .cl-ref{font-size:11px;font-family:var(--mono);color:var(--text-muted);}
  .cl-field{font-size:13px;margin-bottom:3px;}
  .cl-old{text-decoration:line-through;color:var(--text-faint);margin-right:4px;}
  .cl-reason{font-size:12px;color:var(--text-muted);font-family:var(--mono);}
  .cl-empty{font-size:13px;color:var(--text-faint);text-align:center;padding:30px 0;}
  .overlay{position:fixed;inset:0;background:rgba(26,25,23,0.5);display:flex;align-items:flex-end;z-index:200;}
  .overlay.hidden{display:none;}
  .modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal-title{font-size:16px;font-weight:500;margin-bottom:4px;}
  .modal-sub{font-size:12px;color:var(--text-muted);font-family:var(--mono);margin-bottom:16px;}
  .field-group{margin-bottom:12px;}
  .field-label{font-size:12px;color:var(--text-muted);font-family:var(--mono);margin-bottom:4px;display:block;}
  .required{color:var(--red);}
  input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;padding:9px 10px;font-family:var(--sans);outline:none;transition:border-color 0.15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--border-strong);}
  select{appearance:none;-webkit-appearance:none;cursor:pointer;}
  textarea{resize:none;height:64px;font-family:var(--sans);}
  .old-val-box{font-size:13px;color:var(--text-muted);padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-family:var(--mono);}
  .warn-box{font-size:12px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:9px 11px;margin-bottom:12px;line-height:1.6;}
  .modal-err{display:none;font-size:12px;color:var(--red);font-family:var(--mono);margin-bottom:10px;}
  .modal-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px;}
  .btn{padding:11px;font-size:13px;font-family:var(--sans);font-weight:500;border:1px solid var(--border);border-radius:9px;background:transparent;cursor:pointer;transition:background 0.15s;}
  .btn:hover{background:var(--bg);}
  .btn-confirm-green{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
  .btn-confirm-red{background:var(--red-bg);color:var(--red);border-color:var(--red-border);}
</style>
</head>
<body>
<!-- Populated from /api/config on load — see loadNoteConfig() in the script. -->
<datalist id="note-suggestions"></datalist>
<header>
  <a href="./" style="display:inline-block;font-size:11px;color:var(--text-muted);text-decoration:none;font-family:var(--mono);padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);margin-bottom:8px;">← Home</a>
  <div class="header-title">Edit log</div>
  <div class="header-sub">pipeline v4 · edit_log.html</div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('rows')">Transactions</button>
    <button class="tab" onclick="switchTab('log')">Changelog</button>
  </div>
</header>

<div id="view-rows" class="view active"><div id="tx-list"></div></div>
<div id="view-log" class="view"><div id="cl-list"></div></div>

<div class="overlay hidden" id="edit-overlay">
  <div class="modal">
    <div class="modal-title">Edit row</div>
    <div class="modal-sub" id="edit-modal-sub">—</div>
    <div class="field-group">
      <label class="field-label">Field to edit</label>
      <select id="edit-field" onchange="onFieldChange()">
        <option value="">— select field —</option>
        <option>Date</option><option>Description</option><option>Amount</option><option>Category</option><option>Note</option>
      </select>
    </div>
    <div class="field-group" id="old-val-wrap" style="display:none;">
      <label class="field-label">Current value</label>
      <div class="old-val-box" id="old-val-display">—</div>
    </div>
    <div class="field-group" id="new-val-wrap" style="display:none;">
      <label class="field-label">New value</label>
      <div id="edit-new-val-slot"></div>
    </div>
    <div class="field-group">
      <label class="field-label">Reason <span class="required">*</span></label>
      <textarea id="edit-reason" placeholder="Why are you making this change?"></textarea>
    </div>
    <div class="modal-err" id="edit-err"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeOverlay()">Cancel</button>
      <button class="btn btn-confirm-green" onclick="commitEdit()">Save edit</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="delete-overlay">
  <div class="modal">
    <div class="modal-title">Delete row</div>
    <div class="modal-sub" id="delete-modal-sub">—</div>
    <div class="warn-box">Soft delete — row will be hidden from reports but stays in database.csv. It can be recovered by clearing the deleted flag.</div>
    <div class="field-group">
      <label class="field-label">Reason <span class="required">*</span></label>
      <textarea id="delete-reason" placeholder="Why are you deleting this row?"></textarea>
    </div>
    <div class="modal-err" id="delete-err"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeOverlay()">Cancel</button>
      <button class="btn btn-confirm-red" onclick="commitDelete()">Confirm delete</button>
    </div>
  </div>
</div>

<script src="data-source.js"></script>
<script>
// Map UI field names <-> DB column names. The API expects DB column names.
const FIELD_TO_DB={Date:'Date',Description:'Description',Amount:'Amount',Category:'Category',Note:'Note'};

// Option lists must match entry_form.html exactly so data stays consistent.
const CATEGORY_OPTIONS=[
  {group:'Spending',items:['Food','Drinks and Snacks','Transport','Health / Necessaries','Shopping','Groceries','Utilities and Subs','Sports','Social Expenses / Donation','With Roong','To Mom','Other']},
  {group:'Income / Savings',items:['Salary','Bonus','Reimbursement','Payback from someone','Provident Fund','Mutual Fund','Coop Account','Saving for EOY Tax Deduction','Interest payment']},
];
// Note suggestions come from /api/config — see loadNoteConfig() below.
// Card last-4s live in slip_extractor.CARD_BY_LAST4 — single source of truth.

function escapeHtmlMini(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function loadNoteConfig(){
  try{
    const cfg=await DataSource.loadConfig();
    const dl=document.getElementById('note-suggestions');
    const cards=(cfg.cards||[]).map(c=>
      `<option value="${escapeHtmlMini(c.name)}">${escapeHtmlMini(c.name)} (xx${escapeHtmlMini(c.last4)})</option>`);
    const extras=(cfg.extra_note_suggestions||[]).map(v=>
      `<option value="${escapeHtmlMini(v)}">${escapeHtmlMini(v)}</option>`);
    dl.innerHTML=cards.concat(extras).join('');
  }catch(_){/* leave datalist empty — input still functional */}
}
loadNoteConfig();

// Live state, populated from the API.
let transactions=[];
let changelog=[];
let activeIdx=null;

// --- Helpers ---------------------------------------------------------------

function fmtAmount(v){
  const n=parseInt(v);
  return isNaN(n)?String(v||'0'):n.toLocaleString();
}

function rowToTx(r){
  // Database column row -> shape the renderers already use.
  return {
    ref:      r.RefID || '',
    date:     r.Date || '',
    desc:     r.Description || '',
    amount:   r.Amount || '',
    category: r.Category || '',
    note:     r.Note || '',
    source:   (r.RefID||'').toLowerCase()==='manual' ? 'manual' : 'slip',
    deleted:  String(r.Deleted||'').toLowerCase()==='true',
    edited:   String(r.Edited||'').toLowerCase()==='yes',
  };
}

async function apiJson(url,opts){
  const res=await fetch(url,opts);
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Server returned '+res.status));
  return data;
}

function showLoading(targetId,msg){
  document.getElementById(targetId).innerHTML=
    `<div class="cl-empty">${msg}</div>`;
}

function showError(targetId,msg){
  document.getElementById(targetId).innerHTML=
    `<div class="cl-empty" style="color:var(--red);">${msg}</div>`;
}

// --- Loaders ---------------------------------------------------------------

async function loadTx(){
  showLoading('tx-list','Loading…');
  try{
    const rows=await DataSource.loadDatabase();
    transactions=rows.map(rowToTx);
    renderTx();
  }catch(e){
    showError('tx-list','Could not load database: '+e.message);
  }
}

async function loadCl(){
  showLoading('cl-list','Loading…');
  try{
    const rows=await DataSource.loadChangelog();
    // Returns columns: Timestamp, RefID, Action, Field, OldValue, NewValue, Reason
    changelog=rows.map(r=>({
      ref:    r.RefID || '',
      action: (r.Action||'').toLowerCase(),
      field:  r.Field || '',
      old:    r.OldValue || '',
      new:    r.NewValue || '',
      reason: r.Reason || '',
      ts:     r.Timestamp || '',
    }));
    renderCl();
  }catch(e){
    showError('cl-list','Could not load changelog: '+e.message);
  }
}

// --- Renderers -------------------------------------------------------------

function renderTx(){
  const list=document.getElementById('tx-list');
  if(!transactions.length){
    list.innerHTML='<div class="cl-empty">No rows in database yet.</div>';
    return;
  }
  list.innerHTML=transactions.map((tx,i)=>`
    <div class="tx-card ${tx.deleted?'deleted-card':''}">
      <div class="tx-header">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="tx-desc">${tx.desc||'—'}</div>
            <div class="tx-meta">${tx.ref} · ${tx.date} · ${tx.category||'no category'} · ${tx.note||'—'}</div>
            <div class="badges">
              ${tx.deleted?'<span class="badge badge-deleted">deleted</span>':''}
              ${tx.edited&&!tx.deleted?'<span class="badge badge-edited">edited</span>':''}
              ${tx.source==='manual'?'<span class="badge badge-manual">manual</span>':''}
            </div>
          </div>
          <div class="tx-amount">฿${fmtAmount(tx.amount)}</div>
        </div>
      </div>
      ${!tx.deleted
        ?`<div class="tx-actions">
            <button class="tx-btn btn-edit" onclick="openEdit(${i})">✎ Edit</button>
            <button class="tx-btn btn-delete" onclick="openDelete(${i})">✕ Delete</button>
          </div>`
        :`<div class="deleted-note">Hidden from reports · stays in database.csv</div>`
      }
    </div>`).join('');
}

function renderCl(){
  const list=document.getElementById('cl-list');
  if(!changelog.length){list.innerHTML='<div class="cl-empty">No changes logged yet.</div>';return;}
  // API order is append (oldest first). Newest first for display.
  list.innerHTML=[...changelog].reverse().map(cl=>`
    <div class="cl-row">
      <div class="cl-top">
        <span class="cl-ref">${cl.ref} · ${cl.ts}</span>
        <span class="badge ${cl.action==='edit'?'badge-edited':'badge-deleted'}">${cl.action}</span>
      </div>
      ${cl.action==='edit'
        ?`<div class="cl-field"><span class="cl-old">${cl.field}: ${cl.old||'blank'}</span>→ ${cl.new||'blank'}</div>`
        :`<div class="cl-field" style="color:var(--red);">Row removed from reports</div>`}
      <div class="cl-reason">↳ ${cl.reason}</div>
    </div>`).join('');
}

function switchTab(tab){
  document.getElementById('view-rows').className='view'+(tab==='rows'?' active':'');
  document.getElementById('view-log').className='view'+(tab==='log'?' active':'');
  document.querySelectorAll('.tab').forEach((t,i)=>t.className='tab'+(i===(tab==='rows'?0:1)?' active':''));
  if(tab==='log') loadCl();
  if(tab==='rows') loadTx();
}

// --- Edit flow -------------------------------------------------------------

function openEdit(i){
  activeIdx=i;
  const tx=transactions[i];
  document.getElementById('edit-modal-sub').textContent=`${tx.ref} · ${tx.desc}`;
  document.getElementById('edit-field').value='';
  document.getElementById('old-val-wrap').style.display='none';
  document.getElementById('new-val-wrap').style.display='none';
  document.getElementById('edit-new-val-slot').innerHTML='';
  document.getElementById('edit-reason').value='';
  document.getElementById('edit-err').style.display='none';
  document.getElementById('edit-overlay').className='overlay';
}

function buildEditControl(field,currentVal){
  // Returns the HTML for the New value input — typed for the field.
  // Category and Note allow blank (the spec says blank is valid).
  if(field==='Date'){
    return `<input type="date" id="edit-new-val" value="${currentVal||''}">`;
  }
  if(field==='Amount'){
    return `<input type="number" id="edit-new-val" min="0" step="1" placeholder="0" value="${currentVal||''}">`;
  }
  if(field==='Category'){
    const groups=CATEGORY_OPTIONS.map(g=>{
      const opts=g.items.map(it=>
        `<option ${it===currentVal?'selected':''}>${it}</option>`
      ).join('');
      return `<optgroup label="${g.group}">${opts}</optgroup>`;
    }).join('');
    return `<select id="edit-new-val">
        <option value="" ${!currentVal?'selected':''}>— leave blank —</option>
        ${groups}
      </select>`;
  }
  if(field==='Note'){
    // Free-text input with datalist suggestions so the user can type anything
    // (a friend's name, custom label) but still pick from known cards quickly.
    return `<input type="text" id="edit-new-val" list="note-suggestions"
              placeholder="type or pick a card"
              value="${(currentVal||'').replace(/"/g,'&quot;')}">`;
  }
  // Description and any fallback: plain text.
  return `<input type="text" id="edit-new-val" placeholder="New ${field.toLowerCase()}…" value="${(currentVal||'').replace(/"/g,'&quot;')}">`;
}

function onFieldChange(){
  const field=document.getElementById('edit-field').value;
  const oldWrap=document.getElementById('old-val-wrap');
  const newWrap=document.getElementById('new-val-wrap');
  if(!field){oldWrap.style.display='none';newWrap.style.display='none';return;}
  const tx=transactions[activeIdx];
  const raw={Date:tx.date,Description:tx.desc,Amount:tx.amount,Category:tx.category,Note:tx.note};
  const current=raw[field];
  // Show current value (display blank as the word "blank" for clarity).
  document.getElementById('old-val-display').textContent=(current===''||current==null)?'blank':current;
  // Swap in the typed control. We pre-fill it with the current value so a small
  // tweak (e.g. changing one digit) is a single edit, not a full retype.
  document.getElementById('edit-new-val-slot').innerHTML=buildEditControl(field,current);
  oldWrap.style.display='block';
  newWrap.style.display='block';
}

async function commitEdit(){
  const field=document.getElementById('edit-field').value;
  const reason=document.getElementById('edit-reason').value.trim();
  const err=document.getElementById('edit-err');
  const tx=transactions[activeIdx];

  if(!field){err.textContent='Pick a field to edit.';err.style.display='block';return;}
  if(!reason){err.textContent='Reason is required.';err.style.display='block';return;}

  // Read the new value from whatever control was swapped in.
  const inp=document.getElementById('edit-new-val');
  if(!inp){err.textContent='No value selected.';err.style.display='block';return;}

  let rawVal=inp.value;
  let newVal=typeof rawVal==='string'?rawVal.trim():String(rawVal);
  const raw={Date:tx.date,Description:tx.desc,Amount:String(tx.amount||''),Category:tx.category||'',Note:tx.note||''};
  const oldVal=raw[field]||'';

  // Per-field validation.
  if(field==='Date'){
    if(!newVal){err.textContent='Date is required.';err.style.display='block';return;}
    // <input type="date"> always emits YYYY-MM-DD, but double-check.
    if(!/^\d{4}-\d{2}-\d{2}$/.test(newVal)){
      err.textContent='Date must be YYYY-MM-DD.';err.style.display='block';return;
    }
  } else if(field==='Amount'){
    if(newVal===''){err.textContent='Amount is required.';err.style.display='block';return;}
    const n=Number(newVal);
    if(!Number.isFinite(n)||n<0||!Number.isInteger(n)){
      err.textContent='Amount must be a non-negative whole number.';err.style.display='block';return;
    }
    newVal=String(n);
  } else if(field==='Description'){
    if(!newVal){err.textContent='Description cannot be blank.';err.style.display='block';return;}
  }
  // Category and Note allow blank — no extra check.

  if(newVal===oldVal){
    err.textContent='New value is the same as the current value.';err.style.display='block';return;
  }
  err.style.display='none';

  const btn=document.querySelector('#edit-overlay .btn-confirm-green');
  const orig=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
  try{
    await DataSource.submitEdit({
      RefID:    tx.ref,
      Field:    FIELD_TO_DB[field],
      NewValue: newVal,
      Reason:   reason,
    });
    closeOverlay();
    await loadTx();
  }catch(e){
    err.textContent='Save failed: '+e.message;
    err.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent=orig;
  }
}

// --- Delete flow -----------------------------------------------------------

function openDelete(i){
  activeIdx=i;
  const tx=transactions[i];
  document.getElementById('delete-modal-sub').textContent=`${tx.ref} · ${tx.desc} · ฿${fmtAmount(tx.amount)}`;
  document.getElementById('delete-reason').value='';
  document.getElementById('delete-err').style.display='none';
  document.getElementById('delete-overlay').className='overlay';
}

async function commitDelete(){
  const reason=document.getElementById('delete-reason').value.trim();
  const err=document.getElementById('delete-err');
  if(!reason){err.textContent='Reason is required.';err.style.display='block';return;}
  err.style.display='none';
  const tx=transactions[activeIdx];
  const btn=document.querySelector('#delete-overlay .btn-confirm-red');
  const orig=btn.textContent; btn.disabled=true; btn.textContent='Deleting…';
  try{
    await DataSource.submitDelete({RefID:tx.ref,Reason:reason});
    closeOverlay();
    await loadTx();
  }catch(e){
    err.textContent='Delete failed: '+e.message;
    err.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent=orig;
  }
}

function closeOverlay(){
  document.getElementById('edit-overlay').className='overlay hidden';
  document.getElementById('delete-overlay').className='overlay hidden';
  activeIdx=null;
}

// Initial load
loadTx();
</script>
</body>
</html>
