<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roong Settlement — Option B</title>
<link rel="stylesheet" href="../warm.css">
<style>
  /* Option B — reskin + green gradient hero summary card. */
  .preview-pill{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;
    transform:translateX(-50%);z-index:9998;background:#33302a;color:#f5f4f0;font-size:11px;
    padding:5px 12px;border-radius:999px;opacity:.92;box-shadow:0 1px 4px rgba(0,0,0,.2);white-space:nowrap;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .hero{background:linear-gradient(135deg,#1a6b3c,#2e8b57);border:none;color:#fff;border-radius:16px;
    padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .hero-label{font-size:11px;opacity:.85;}
  .hero-amount{font-size:30px;font-weight:700;margin:3px 0 4px;}
  .hero-note{font-size:12px;opacity:.85;}
  .roong-row{display:flex;gap:11px;align-items:flex-start;}
  .roong-row.unchecked{opacity:.5;}
  .roong-row input[type=checkbox]{width:19px;height:19px;flex-shrink:0;margin-top:2px;accent-color:var(--green);}
  .rr-body{flex:1;min-width:0;}
  .rr-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .rr-desc{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rr-total{font-weight:600;white-space:nowrap;}
  .rr-meta{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .share-inputs{display:flex;align-items:center;gap:6px;margin-top:9px;}
  .share-inputs input{font-size:14px;border:1px solid var(--border);border-radius:8px;padding:7px 9px;
    background:var(--bg);color:var(--text);width:84px;-webkit-appearance:none;}
  .share-inputs input:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent;}
  .share-sep{font-size:12px;color:var(--text-faint);}
  .share-preview{font-size:12px;color:var(--green);margin-top:5px;}
  .select-all-row{display:flex;align-items:center;gap:9px;padding:2px 2px 12px;user-select:none;}
  .select-all-row input{width:19px;height:19px;accent-color:var(--green);}
  .select-all-label{font-size:13px;color:var(--text-soft);}
  .summary-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
    margin:14px -20px 0;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .summary-count{font-size:11px;color:var(--text-soft);}
  .summary-total{font-size:20px;font-weight:700;}
  .summary-her{font-size:11px;color:var(--green);}
  .btn-send{background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 18px;
    font-size:15px;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .btn-send:disabled{background:#dcd6ca;color:var(--text-faint);}
  .batch-card .bc-head{display:flex;justify-content:space-between;align-items:baseline;}
  .batch-card .bc-amount{font-size:18px;font-weight:700;color:var(--green);}
  .batch-card .bc-id{font-size:11px;color:var(--text-faint);}
  .batch-card .bc-meta{font-size:11px;color:var(--text-faint);margin:2px 0 11px;}
  .shareable-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .shareable-text{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre;line-height:1.7;overflow-x:auto;}
  .btn-copy{display:flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);border-radius:10px;
    background:var(--bg);color:var(--text-soft);padding:8px 12px;margin-bottom:12px;width:fit-content;}
  .btn-copy.copied{color:var(--green);border-color:#b2ddc4;}
  .batch-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .batch-actions button,.batch-actions label{flex:1;min-width:100px;padding:11px;border-radius:11px;font-size:13px;
    font-weight:600;text-align:center;border:1px solid var(--border);background:var(--bg);color:var(--text-soft);cursor:pointer;}
  .btn-confirm{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;}
  .btn-cancel{color:#a4453a!important;}
  .slip-file-input{display:none;}
  .banner{background:var(--green-soft);border:1px solid #b2ddc4;border-radius:14px;padding:14px;margin-bottom:14px;
    display:flex;gap:10px;align-items:flex-start;}
  .banner-icon{font-size:20px;} .banner-title{font-weight:600;color:var(--green);}
  .banner-meta{font-size:11px;color:var(--text-soft);margin-top:3px;line-height:1.6;}
  .hist-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;}
  .hist-header{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer;}
  .hist-amount{font-size:15px;font-weight:600;}
  .hist-id,.hist-date{font-size:11px;color:var(--text-faint);}
  .hist-badge{font-size:10px;background:var(--green-soft);color:var(--green);border:1px solid #b2ddc4;border-radius:6px;padding:2px 7px;}
  .hist-chev{font-size:10px;color:var(--text-faint);transition:transform .15s;display:inline-block;margin-left:6px;}
  .hist-row.open .hist-chev{transform:rotate(90deg);}
  .hist-entries{border-top:1px dashed var(--border);padding:10px 14px;display:none;}
  .hist-row.open .hist-entries{display:block;}
  .hist-entry{display:grid;grid-template-columns:52px 1fr auto;gap:8px;font-size:12px;padding:5px 0;}
  .he-date{color:var(--text-faint);} .he-desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .he-share{color:var(--green);text-align:right;white-space:nowrap;}
  .empty,.loading{padding:28px 0;text-align:center;font-size:13px;color:var(--text-faint);}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#33302a;color:#fff;font-size:12px;
    padding:8px 14px;border-radius:10px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="preview-pill">PREVIEW · Option B — hero summary</div>
<div class="toast" id="toast"></div>
<div class="wrap">
  <div class="topbar">
    <h1>With Roong</h1>
    <a href="./" class="back-link">All options ›</a>
  </div>
  <div class="dateline">Shared expenses · settle up</div>
  <div id="main-content"><div class="loading">Loading…</div></div>
</div>

<script src="mock-data.js"></script>
<script src="roong-shared.js"></script>
<script>
function renderHistRow(batch){
  const expRows = batch.expense_rows || [];
  const n = expRows.length;
  const entries = expRows.length ? [...expRows].sort((a,b)=>(a.Date||'')<(b.Date||'')?-1:1).map(r=>`
    <div class="hist-entry"><div class="he-date">${fmtDateShort(r.Date)}</div>
    <div class="he-desc">${escHtml(r.Description||'')}</div>
    <div class="he-share">${fmtBaht(r.roong_share)}</div></div>`).join('')
    : '<div style="color:var(--text-faint);font-size:12px">No rows</div>';
  return `
  <div class="hist-row" onclick="this.classList.toggle('open')">
    <div class="hist-header">
      <div>
        <div class="hist-id">${escHtml(batch.settlement_id)}</div>
        <div class="hist-amount">${fmtBaht(batch.requested_amount)}</div>
        <div class="hist-date">${fmtDateShort((batch.created_at||'').substring(0,10))} · ${n} expense${n===1?'':'s'}</div>
      </div>
      <div><span class="hist-badge">settled</span><span class="hist-chev">▶</span></div>
    </div>
    <div class="hist-entries">${entries}</div>
  </div>`;
}

function render(){
  const el = document.getElementById('main-content');
  let html = '';

  // --- Hero summary (Option B) ---
  const owed = unsettled.reduce((s,r)=>s+r._share,0);
  const pendingTotal = pendingBatches.reduce((s,b)=>s+(parseFloat(b.requested_amount)||0),0);
  html += `<div class="hero">
    <div class="hero-label">Roong owes you</div>
    <div class="hero-amount">${fmtBaht(owed)}</div>
    <div class="hero-note">${unsettled.length} unsettled expense${unsettled.length===1?'':'s'}${pendingTotal>0?` · ${fmtBaht(pendingTotal)} awaiting payment`:''}</div>
  </div>`;

  if (lastConfirmed){
    html += `<div class="banner"><div class="banner-icon">✓</div><div>
      <div class="banner-title">Settlement confirmed</div>
      <div class="banner-meta">${lastConfirmed.settlement_id} · ${fmtBaht(lastConfirmed.requested_amount)} · ${lastConfirmed.n} expense${lastConfirmed.n===1?'':'s'}<br>
      ${lastConfirmed.confirmed_at?fmtDateShort(lastConfirmed.confirmed_at.substring(0,10)):'just now'}</div></div></div>`;
  }

  const checkedRows = unsettled.filter(r=>r._checked);
  html += `<div class="section-title">Unsettled (${unsettled.length})</div>`;
  if (!unsettled.length){
    html += `<div class="card"><div class="empty">No unsettled “With Roong” expenses</div></div>`;
  } else {
    const allChecked = unsettled.every(r=>r._checked);
    const someChecked = unsettled.some(r=>r._checked);
    html += `<label class="select-all-row"><input type="checkbox" id="select-all-cb" ${allChecked?'checked':''} ${!allChecked&&someChecked?'data-indeterminate="true"':''}><span class="select-all-label">Select all (${unsettled.length})</span></label>`;
    for (let i=0;i<unsettled.length;i++){
      const r=unsettled[i], amount=parseFloat(r.Amount||0);
      html += `<div class="card roong-row${r._checked?'':' unchecked'}">
        <input type="checkbox" data-idx="${i}" ${r._checked?'checked':''}>
        <div class="rr-body">
          <div class="rr-top"><div class="rr-desc">${escHtml(r.Description||'')}</div><div class="rr-total">${fmtBaht(amount)}</div></div>
          <div class="rr-meta">${fmtDateShort(r.Date)} · ${escHtml(r.Note||'')||'—'} · ${escHtml(r.RefID||'')}</div>
          ${r._checked?`<div class="share-inputs">
            <input type="number" min="0" max="100" step="1" value="${r._pct.toFixed(0)}" data-idx="${i}" data-type="pct" placeholder="%">
            <span class="share-sep">% =</span>
            <input type="number" min="0" step="0.5" value="${r._share.toFixed(2)}" data-idx="${i}" data-type="baht" placeholder="฿"></div>
          <div class="share-preview" id="preview-${i}">Roong pays ${fmtBaht(r._share)}</div>`:''}
        </div></div>`;
    }
  }

  if (pendingBatches.length){
    html += `<div class="section-title">Pending payment (${pendingBatches.length})</div>`;
    for (const batch of pendingBatches){
      const expRows = batch.expense_rows||[];
      const shareMap={}; expRows.forEach(r=>shareMap[r.RefID]=parseFloat(r.roong_share||0));
      const text=buildShareableText(expRows,shareMap); const n=expRows.length;
      html += `<div class="card batch-card" id="batch-${escHtml(batch.settlement_id)}">
        <div class="bc-head"><div><div class="bc-id">${escHtml(batch.settlement_id)}</div></div><div class="bc-amount">${fmtBaht(batch.requested_amount)}</div></div>
        <div class="bc-meta">${fmtDateShort((batch.created_at||'').substring(0,10))} · ${n} expense${n===1?'':'s'}</div>
        <div class="shareable-wrap"><div class="shareable-text" id="st-${escHtml(batch.settlement_id)}">${escHtml(text)}</div></div>
        <button class="btn-copy" data-sid="${escHtml(batch.settlement_id)}" onclick="copyText(this)"><span class="copy-icon">⎘</span> Copy text</button>
        <div class="batch-actions">
          ${DataSource.isLocal()?`<label class="btn-upload">📎 Upload slip<input class="slip-file-input" type="file" accept="image/*" data-sid="${escHtml(batch.settlement_id)}" onchange="uploadSlip(this)"></label>`:''}
          <button class="btn-confirm" data-sid="${escHtml(batch.settlement_id)}" onclick="confirmManual(this)">✓ Mark received</button>
          <button class="btn-cancel" data-sid="${escHtml(batch.settlement_id)}" onclick="cancelBatch(this)">✕ Cancel</button>
        </div></div>`;
    }
  }

  html += `<div class="section-title" id="history-section-title">History</div><div id="history-content"><div class="loading">Loading history…</div></div>`;

  if (unsettled.length){
    const herTotal=checkedRows.reduce((s,r)=>s+r._share,0);
    html += `<div class="summary-bar" id="summary-bar">
      <div><div class="summary-count">${checkedRows.length} selected</div><div class="summary-total">${fmtBaht(herTotal)}</div><div class="summary-her">Roong's share</div></div>
      <button class="btn-send" id="btn-send" ${checkedRows.length===0?'disabled':''} onclick="sendRequest()">Send request${checkedRows.length>0?` (${checkedRows.length})`:''}</button></div>`;
  }

  el.innerHTML = html;
  attachListeners();
  loadHistory();
}
loadAll();
</script>
</body>
</html>
